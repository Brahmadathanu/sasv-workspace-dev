<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Signing you in…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, Arial, sans-serif;
        margin: 24px;
        color: #0b1420;
      }
      .card {
        max-width: 560px;
        margin: 12vh auto 0;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 18px;
        background: #fff;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0.2rem 0;
      }
      p {
        color: #475569;
        margin: 0.4rem 0;
      }
      button {
        margin-top: 8px;
        padding: 0.6rem 1rem;
        border-radius: 8px;
        border: 1px solid #0a62c3;
        background: #0a62c3;
        color: #fff;
        cursor: pointer;
      }
      input {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Signing you in…</h1>
      <p id="status">
        If the app is installed, it should open automatically. You can close
        this tab after it does.
      </p>
      <button id="open">Open SASV Utilities Hub</button>
    </div>

    <script type="module">
      import { supabase } from "../../shared/js/supabaseClient.js";

      const card = document.querySelector(".card");
      const status = document.getElementById("status");
      const openButton = document.getElementById("open");
      const HUB_URL = "/utilities-hub/";
      let recoveryEventSeen = false;

      const {
        data: { subscription: authSubscription },
      } = supabase.auth.onAuthStateChange((event) => {
        if (event === "PASSWORD_RECOVERY") {
          recoveryEventSeen = true;
        }
      });

      function setStatus(text) {
        if (status) {
          status.textContent = text;
        }
      }

      function getUrlAuthContext() {
        const hashParams = new URLSearchParams(location.hash.replace(/^#/, ""));
        const searchParams = new URLSearchParams(location.search);
        const explicitType =
          searchParams.get("type") || hashParams.get("type") || "";
        const appFlow = searchParams.get("flow") || hashParams.get("flow") || "";

        return {
          hashParams,
          searchParams,
          isRecovery:
            explicitType.toLowerCase() === "recovery" ||
            appFlow.toLowerCase() === "recovery",
        };
      }

      function broadcastSignedIn() {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.ready
            .then((reg) =>
              (reg.active || navigator.serviceWorker.controller)?.postMessage({
                type: "signed-in",
              }),
            )
            .catch(() => {});
        }

        try {
          const bc = new BroadcastChannel("sasv-auth");
          bc.postMessage({ type: "signed-in" });
          bc.close();
        } catch {}
      }

      async function establishSessionFromUrl() {
        const { hashParams, searchParams, isRecovery } = getUrlAuthContext();
        const accessToken = hashParams.get("access_token");
        const refreshToken = hashParams.get("refresh_token");
        const authCode = searchParams.get("code");
        const tokenHash =
          searchParams.get("token_hash") || hashParams.get("token_hash");
        const otpType =
          searchParams.get("type") || hashParams.get("type") || "signup";

        if (accessToken && refreshToken) {
          const { error } = await supabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken,
          });
          if (error) throw error;
          return { isRecovery };
        }

        if (tokenHash) {
          const { error } = await supabase.auth.verifyOtp({
            token_hash: tokenHash,
            type: otpType,
          });
          if (error) throw error;
          return { isRecovery };
        }

        if (authCode) {
          const { error } =
            await supabase.auth.exchangeCodeForSession(authCode);
          if (error) throw error;
          return { isRecovery };
        }

        const {
          data: { session },
          error,
        } = await supabase.auth.getSession();
        if (error) throw error;
        if (!session) {
          throw new Error("Invalid or expired authentication link.");
        }

        return { isRecovery };
      }

      function openHub() {
        location.href = HUB_URL;
      }

      function scheduleOpenHub(delayMs = 350) {
        window.setTimeout(openHub, delayMs);
      }

      function showResetForm() {
        if (card.querySelector("form")) return;

        if (openButton) {
          openButton.style.display = "none";
        }

        const form = document.createElement("form");
        form.innerHTML = `
          <h2>Set a new password</h2>
          <p style="color:#475569;margin:0.4rem 0">Enter and confirm the new password to finish resetting your account.</p>
          <input id="new-pass" type="password" autocomplete="new-password" placeholder="New password" style="height:40px;padding:6px 10px;border:1px solid #e5e7eb;border-radius:8px;width:100%;margin-top:8px" />
          <input id="confirm-pass" type="password" autocomplete="new-password" placeholder="Confirm new password" style="height:40px;padding:6px 10px;border:1px solid #e5e7eb;border-radius:8px;width:100%;margin-top:8px" />
          <button id="save-pass" type="submit">Save password</button>
          <p id="msg" role="status" aria-live="polite" style="margin-top:8px;color:#475569"></p>
        `;
        card.appendChild(form);

        const msg = form.querySelector("#msg");
        const saveButton = form.querySelector("#save-pass");

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const pwd = form.querySelector("#new-pass").value;
          const confirmPwd = form.querySelector("#confirm-pass").value;

          if (!pwd) {
            msg.textContent = "Enter a new password.";
            return;
          }
          if (pwd !== confirmPwd) {
            msg.textContent = "The passwords do not match.";
            return;
          }

          saveButton.disabled = true;
          msg.textContent = "Updating…";
          try {
            const { error } = await supabase.auth.updateUser({ password: pwd });
            if (error) throw error;
            msg.textContent = "Password updated successfully.";
            setStatus("Password updated. Opening the hub…");
            broadcastSignedIn();
            scheduleOpenHub();
          } catch (err) {
            console.error(err);
            msg.textContent =
              err?.message || "Could not update password. Request a new reset link and try again.";
            saveButton.disabled = false;
          }
        });
      }

      async function boot() {
        try {
          setStatus("Completing sign-in…");
          const authContext = await establishSessionFromUrl();

          await Promise.resolve();
          if (authContext.isRecovery || recoveryEventSeen) {
            setStatus("Recovery verified. Set a new password to continue.");
            showResetForm();
            return;
          }

          setStatus("Sign-in complete. Opening the hub…");
          broadcastSignedIn();
          scheduleOpenHub();
        } catch (error) {
          console.error("Auth callback failed", error);
          setStatus(
            error?.message ||
              "Could not complete sign-in automatically. Request a new link and try again.",
          );
        }
      }

      openButton?.addEventListener("click", openHub);
      window.addEventListener("pagehide", () => authSubscription.unsubscribe(), {
        once: true,
      });

      boot();
    </script>
  </body>
</html>
