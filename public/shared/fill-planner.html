<!DOCTYPE html>
<html lang="en-GB" data-sasv-theme="sasv-core">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SASV WORKSPACE | Fill Planner</title>
    <link rel="stylesheet" href="../shared/css/style.css" />
    <link rel="stylesheet" href="../shared/css/sasv-fill-planner.css" />
    <link rel="manifest" href="/utilities-hub/manifest.webmanifest" />
    <link
      rel="icon"
      href="/shared/assets/branding/derived/favicon.ico"
      sizes="any"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/shared/assets/branding/derived/icon-192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/shared/assets/branding/derived/apple-touch-icon-180.png"
    />
    <meta name="theme-color" content="#005A8D" />
  </head>
  <body
    class="sasv-module sasv-module--app sasv-fill-planner"
    data-theme="system"
  >
    <div class="header-card">
      <header class="page-header">
        <div class="fp-header-copy">
          <h1 class="sasv-module-title">Fill Planner</h1>
          <p class="page-sub">
            Calculate fill quantities by product, bulk, and optional urgent
            orders.
          </p>
        </div>
        <div class="header-actions actions">
          <div
            id="fp-updated"
            class="sc-snapshot"
            tabindex="0"
            role="button"
            aria-haspopup="true"
            aria-expanded="false"
            aria-label="Stock snapshot"
          >
            <span class="sc-snapshot-dot" aria-hidden="true"></span>
            <span class="sc-snapshot-label">Snapshot</span>
            <div id="fp-status-detail" style="display: none">
              Last stock snapshot: —
            </div>
          </div>
          <button type="button" id="homeBtn" class="btn">HOME</button>
        </div>
      </header>
    </div>

    <div class="fp-main">
      <div class="fp-controls">
        <label class="fp-product-field">
          Product&nbsp;
          <!-- Native select remains authoritative; searchable UI via enhanceSearchableSelect -->
          <select
            id="fp-product"
            class="sasv-native-select-sr"
            aria-label="Product"
            aria-hidden="true"
            tabindex="-1"
          >
            <option value=""></option>
          </select>
        </label>

        <label>
          Bulk&nbsp;
          <input id="fp-bulk" type="number" step="0.01" inputmode="decimal" />
          <span id="fp-uom">(base&nbsp;UOM)</span>
        </label>

        <label>
          <input id="fp-overshoot" type="checkbox" /> allow&nbsp;overshoot
        </label>
      </div>

      <!-- ─── SKU Metrics table (appears after product pick) ───────────── -->
      <div
        id="fp-metrics-header"
        class="fp-metrics-header"
        style="display: none"
      >
        <h3 class="fp-subtitle" id="fp-metrics-title">SKU Metrics</h3>
      </div>

      <table id="fp-metrics-table" style="display: none">
        <thead id="fp-metrics-head"></thead>
        <tbody id="fp-metrics-body"></tbody>
      </table>

      <!-- Urgent / ad-hoc orders ----------------------------------------->
      <h3 id="fp-emg-title" class="fp-subtitle" style="display: none">
        Urgent Orders (optional)
      </h3>

      <table id="fp-emg-table" style="display: none; margin-bottom: 0.6rem">
        <thead>
          <tr>
            <th style="text-align: left">SKU</th>
            <th>Qty&nbsp;(Nos)</th>
          </tr>
        </thead>
        <tbody id="fp-emg-body">
          <!-- rows injected by JS -->
        </tbody>
      </table>

      <div id="fp-run-wrap" class="fp-run-wrap" style="display: none">
        <button type="button" id="fp-run" class="btn primary">Calculate</button>
      </div>

      <div id="msg"></div>

      <h3
        id="fp-title"
        class="fp-subtitle"
        style="text-align: left; margin: 1.2rem 0 0.4rem 0; display: none"
      >
        Fill&nbsp;Plan for Remaining&nbsp;Bulk (after urgent orders)
      </h3>

      <table id="fp-table" style="display: none">
        <thead>
          <tr id="fp-head">
            <th>Region</th>
          </tr>
        </thead>
        <tbody id="fp-body"></tbody>
      </table>

      <details id="fp-workings" style="display: none; margin-top: 16px">
        <summary>Calculation Workings</summary>

        <div class="fp-workings-toolbar">
          <button type="button" id="fp-workings-copy" class="btn">Copy</button>
          <label style="display: inline-flex; gap: 6px; align-items: center">
            <input id="fp-workings-autoscroll" type="checkbox" checked />
            Auto-scroll
          </label>
        </div>

        <div class="fp-workings-scroll">
          <pre id="fp-workings-body"></pre>
        </div>
      </details>
    </div>

    <script type="module" src="../shared/js/fill-planner.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("/public/sw.js", { scope: "/public/" })
          .catch(console.error);
      }
    </script>
  </body>
</html>
