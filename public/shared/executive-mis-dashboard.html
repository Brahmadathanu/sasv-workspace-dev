<!doctype html>
<html lang="en-GB" data-sasv-theme="sasv-core">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Executive Intelligence</title>
    <link rel="stylesheet" href="../shared/css/style.css" />
    <style>
      /*
       * MIS-C1: component-level aliases over the shared semantic tokens
       * (css/design-tokens.css). Fallbacks keep the page legible if a token
       * is ever absent; no palette values are hard-coded in new components.
       */
      :root {
        --mis-surface: var(--sasv-surface, var(--sasv-surface));
        --mis-surface-soft: var(--sasv-surface-soft, var(--sasv-surface));
        --mis-border: var(--sasv-border, var(--sasv-border));
        --mis-divider: var(--sasv-divider, var(--sasv-border));
        --mis-text: var(--sasv-text, var(--sasv-text));
        --mis-text-secondary: var(--sasv-text-secondary, var(--mis-text));
        --mis-muted: var(--sasv-text-muted, var(--sasv-text-muted));
        --mis-accent: var(--sasv-action-primary, var(--sasv-action-primary));
        --mis-accent-soft: var(--sasv-action-primary-soft, var(--mis-surface-soft));
        --mis-accent-soft-border: var(--sasv-action-primary-soft-border, var(--mis-border));
        --mis-on-accent: var(--sasv-text-on-primary);
        --mis-search-bg: var(--sasv-search-select-bg, var(--mis-surface-soft));
        --mis-search-border: var(--sasv-search-select-border, var(--mis-border));
        --mis-focus-ring: var(--sasv-focus-ring, var(--mis-accent-soft-border));
        --mis-warning: var(--sasv-warning, currentColor);
        --mis-warning-bg: var(--sasv-warning-bg, var(--mis-surface-soft));
        --mis-warning-border: var(--sasv-warning-border, var(--mis-border));
        --mis-danger: var(--sasv-danger, currentColor);
        --mis-danger-bg: var(--sasv-danger-bg, var(--mis-surface-soft));
        --mis-danger-border: var(--sasv-danger-border, var(--mis-border));
        --mis-info: var(--sasv-info, currentColor);
        --mis-info-bg: var(--sasv-info-bg, var(--mis-surface-soft));
        --mis-info-border: var(--sasv-info-border, var(--mis-border));
      }

      /*
       * Executive Intelligence typography scale (compact ERP). One ladder for the whole page: every font-size below resolves to
       * one of these tokens (which defer to the shared --sasv-text-* tokens where they exist). 16px form-control size on phones
       * is the iOS focus-zoom floor and is the only literal size.
       */
      :root {
        --ei-fs-2xs: var(--sasv-text-xs, 0.75rem); /* 12px: the reference minimum (Stock Checker / PEC tables, badges, captions) */
        --ei-fs-xs: var(--sasv-text-xs, 0.75rem); /* 12px: notes, table cells, meta */
        --ei-fs-sm: var(--sasv-text-sm, 0.8125rem); /* 13px: controls, tabs, body */
        --ei-fs-md: var(--sasv-text-md, 0.875rem); /* 14px: section titles, KPI values */
        --ei-fs-lg: var(--sasv-text-lg, 1rem); /* 16px: hero figures */
        --ei-fs-title: 1.125rem; /* 18px: page title */
        --ei-fs-input-phone: 16px;
      }

      /* MIS G7: production evidence status (compact, token-based) */
      .mis-gov { margin: 10px 0; border: 1px solid var(--mis-border); border-radius: 8px; background: var(--mis-surface); padding: 6px 10px; }
      .mis-gov > summary { cursor: pointer; font-weight: 600; font-size: var(--ei-fs-sm); color: var(--mis-text); }
      .mis-gov > summary:focus-visible { outline: 2px solid var(--mis-focus-ring); outline-offset: 2px; }
      .mis-gov-mode { margin-left: 8px; font-weight: 400; color: var(--mis-muted); font-size: var(--ei-fs-sm); }
      .mis-gov-states { margin: 8px 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: var(--ei-fs-md); color: var(--mis-text-secondary); }
      .mis-gov-tag { display: inline-block; min-width: 7.5em; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--mis-border); font-size: var(--ei-fs-xs); font-weight: 600; text-align: center; background: var(--mis-surface-soft); color: var(--mis-muted); }
      .mis-gov-ok { color: var(--sasv-success, var(--mis-text)); background: var(--sasv-success-bg, var(--mis-surface-soft)); border-color: var(--sasv-success-border, var(--mis-border)); }
      .mis-gov-warn { color: var(--mis-warning); background: var(--mis-warning-bg); border-color: var(--mis-warning-border); }
      .mis-gov-danger { color: var(--mis-danger); background: var(--mis-danger-bg); border-color: var(--mis-danger-border); }
      .mis-gov-hist { margin: 6px 0 2px; font-size: var(--ei-fs-sm); color: var(--mis-muted); }
      .mis-gov-bar { margin: 6px 0; font-size: var(--ei-fs-sm); color: var(--mis-text-secondary); }
      .mis-gov-bar select { margin-left: 6px; min-height: 32px; font-size: var(--ei-fs-sm); }
      .mis-gov-table-wrap { overflow-x: auto; margin: 6px 0; max-height: 360px; overflow-y: auto; }
      .mis-gov-table { width: 100%; border-collapse: collapse; font-size: var(--ei-fs-sm); }
      .mis-gov-table th { position: sticky; top: 0; background: var(--mis-surface-soft); text-align: left; font-weight: 600; }
      .mis-gov-table th, .mis-gov-table td { padding: 4px 8px; border-bottom: 1px solid var(--mis-border); vertical-align: top; }
      .mis-gov-pager { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: var(--ei-fs-xs); color: var(--mis-muted); }
      .mis-gov-pager button { min-height: 32px; padding: 2px 12px; }
      @media (max-width: 520px) { .mis-gov-tag { min-width: 0; } .mis-gov-table th, .mis-gov-table td { padding: 4px 6px; } }

      html,
      body {
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        box-sizing: border-box;
      }

      /* HOME parity with Stock Checker: fill/border/colour come from the shared home tokens (html[data-sasv-theme] above).
         Stock Checker's body class also sets the shared sans family and a zero icon gap at <=520px; mirrored here, tokens only. */
      #homeBtn.sasv-home-btn { font-family: var(--sasv-font-sans); }
      @media (max-width: 520px) { #homeBtn.sasv-home-btn { gap: 0; } }

      body {
        font-family: var(--sasv-font-sans); /* R7: the shared sans family, as every reference module */
        font-size: var(--ei-fs-md); /* R8: Explorer body typography */
        line-height: 1.45;
        display: flex;
        flex-direction: column;
        padding: 20px;
        background: var(--sasv-bg);
        color: var(--sasv-text);
      }

      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .page-header h1 {
        margin: 0;
        color: var(--primary);
      }

      .page-sub {
        margin-top: 4px;
        color: var(--sasv-text-muted);
        font-size: var(--ei-fs-sm);
        line-height: 1.4;
      }

      .header-actions {
        display: flex;
        align-items: stretch;
        gap: 8px;
        flex-shrink: 0;
      }

      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 7px;
        border: 1px solid var(--sasv-border);
        border-radius: 6px;
        background: var(--sasv-surface);
        color: inherit;
        cursor: pointer;
      }

      .icon-btn:hover:not(:disabled) {
        background: var(--mis-surface-soft);
      }

      .icon-btn:focus-visible,
      .modal-close-btn:focus-visible,
      .mis-retry-btn:focus-visible,
      .finance-table tbody tr:focus-visible {
        outline: 2px solid var(--mis-accent);
        outline-offset: 1px;
      }

      .icon-btn:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .status {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid var(--sasv-border);
        border-radius: 8px;
        background: var(--sasv-surface);
        color: var(--sasv-text-muted);
        font-size: var(--ei-fs-sm);
      }

      .status.error {
        border-color: var(--mis-danger-border);
        background: var(--mis-danger-bg);
        color: var(--mis-danger);
      }

      .status.warning {
        border-color: var(--mis-warning-border);
        background: var(--mis-warning-bg);
        color: var(--mis-warning);
      }

      .status.success {
        border-color: var(--sasv-success-border, var(--mis-border));
        background: var(--sasv-success-bg, var(--mis-surface-soft));
        color: var(--sasv-success, currentColor);
      }

      /* Permission denied / unverifiable: show the message only. */
      .mis-denied .tabs-card,
      .mis-denied .detail-section,
      .mis-denied .kpi-grid {
        display: none;
      }

      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 8px;
        margin-top: 12px;
      }

      .kpi-card {
        position: relative;
        border: 1px solid var(--sasv-border);
        border-left: 3px solid var(--mis-accent);
        border-radius: 8px;
        padding: 9px 34px 9px 10px;
        background: var(--sasv-surface);
        min-height: 74px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
      }

      .kpi-card.caution {
        border-left-color: var(--mis-warning);
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--mis-warning) 8%, transparent) 0%,
          var(--sasv-surface) 48%
        );
      }

      .kpi-card.warning {
        border-left-color: var(--mis-warning);
      }

      .kpi-title {
        color: var(--sasv-text-muted);
        font-size: var(--ei-fs-2xs);
        font-weight: var(--sasv-fw-semibold);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        line-height: 1.25;
      }

      .kpi-value {
        color: var(--sasv-text);
        font-size: var(--ei-fs-lg);
        font-weight: var(--sasv-fw-bold);
        line-height: 1.15;
        overflow-wrap: anywhere;
      }

      .kpi-card.caution .kpi-value,
      .kpi-card.warning .kpi-value {
        color: var(--mis-warning);
      }

      .kpi-info-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 20px;
        height: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 999px;
        background: transparent;
        color: var(--sasv-text-muted);
        cursor: pointer;
      }

      .kpi-info-btn:hover,
      .kpi-info-btn:focus-visible,
      .kpi-info-btn[aria-expanded="true"] {
        border-color: var(--mis-border);
        background: var(--mis-surface-soft);
        color: var(--mis-accent);
        outline: none;
      }

      .kpi-popover {
        position: fixed;
        z-index: 1000;
        width: min(280px, calc(100vw - 24px));
        padding: 10px 12px;
        border: 1px solid var(--sasv-border);
        border-radius: 8px;
        background: var(--sasv-surface);
        box-shadow: var(--sasv-shadow-lg);
        color: var(--sasv-text);
        font-size: var(--ei-fs-xs);
        line-height: 1.45;
      }

      .kpi-popover-title {
        margin-bottom: 6px;
        color: var(--sasv-text-muted);
        font-size: var(--ei-fs-2xs);
        font-weight: var(--sasv-fw-semibold);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .kpi-popover-row + .kpi-popover-row {
        margin-top: 6px;
      }

      .kpi-popover-label {
        display: block;
        color: var(--sasv-text-muted);
        font-size: var(--ei-fs-2xs);
        font-weight: var(--sasv-fw-semibold);
        text-transform: uppercase;
      }

      .planning-notice {
        margin-top: 10px;
        padding: 9px 11px;
        border: 1px solid var(--mis-warning-border);
        border-radius: 8px;
        background: var(--mis-warning-bg);
        color: var(--mis-warning);
        font-size: var(--ei-fs-xs);
        line-height: 1.45;
      }

      .tabs-card {
        margin-top: 12px;
        padding: 8px 10px;
        border: 1px solid var(--sasv-border);
        border-radius: 8px;
        background: var(--sasv-surface);
      }

      .lens-pills {
        display: flex;
        gap: 6px;
        padding: 8px;
        border: 1px solid var(--sasv-border);
        border-radius: 10px;
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--mis-accent) 5%, transparent) 0%,
          color-mix(in srgb, var(--mis-accent) 2%, transparent) 100%
        );
        align-items: center;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .lens-pills::-webkit-scrollbar {
        display: none;
      }

      .lens-pills .pill {
        flex: 0 0 auto;
        padding: 8px 16px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: var(--erp-muted, var(--sasv-text-muted));
        font-size: var(--ei-fs-sm);
        font-weight: var(--sasv-fw-semibold);
        line-height: 1.2;
        white-space: nowrap;
        cursor: pointer;
        transition: all 0.16s ease;
      }

      .lens-pills .pill:hover {
        border-color: color-mix(in srgb, var(--mis-accent) 12%, transparent);
        background: color-mix(in srgb, var(--mis-accent) 5%, transparent);
        color: var(--sasv-text);
      }

      .lens-pills .pill:focus {
        outline: none;
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--mis-accent) 12%, transparent);
      }

      .lens-pills .pill.active {
        border-color: var(--sasv-action-primary);
        background: var(--sasv-action-primary);
        color: var(--mis-on-accent);
        box-shadow: 0 4px 14px color-mix(in srgb, var(--mis-accent) 22%, transparent);
      }

      .tab-select-wrap {
        position: relative;
        display: none;
        width: 100%;
      }

      .tab-select {
        width: 100%;
        padding: 8px 42px 8px 10px;
        border: 1px solid var(--sasv-action-primary);
        border-radius: 8px;
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--mis-accent) 12%, transparent) 0%,
          color-mix(in srgb, var(--mis-accent) 6%, transparent) 100%
        );
        color: var(--sasv-text);
        font-size: var(--ei-fs-md);
        font-weight: 600;
        cursor: pointer;
        appearance: none;
      }

      .tab-select-icon {
        position: absolute;
        right: 12px;
        top: 50%;
        width: 18px;
        height: 18px;
        color: var(--sasv-action-primary);
        transform: translateY(-50%);
        pointer-events: none;
      }

      .detail-section {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
        margin-top: 8px;
        border: 1px solid var(--sasv-border);
        border-radius: 8px;
        background: var(--sasv-surface);
        overflow: hidden;
      }

      .tab-panel {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        padding: 10px;
        min-height: 0;
      }

      .tab-panel.production-panel {
        overflow: auto;
      }

      /* Let the Production panel scroll rather than crushing its tables. */
      .tab-panel.production-panel > * {
        flex-shrink: 0;
      }

      .finance-scope-note,
      .sales-scope-note,
      .inventory-scope-note,
      .fg-scope-note,
      .production-scope-note {
        margin-bottom: 8px;
        color: var(--sasv-text-muted);
        font-size: var(--ei-fs-xs);
        line-height: 1.45;
      }

      .sales-period-line,
      .inventory-scope-line,
      .fg-scope-line,
      .production-period-line {
        margin-bottom: 3px;
        color: var(--sasv-text);
        font-weight: var(--sasv-fw-semibold);
      }

      /* Production Summary: deliberately subordinate to the primary KPI cards. */
      .production-summary-heading {
        margin: 6px 0 6px;
        color: var(--mis-muted);
        font-size: var(--ei-fs-xs);
        font-weight: var(--sasv-fw-semibold);
        letter-spacing: 0.02em;
      }

      .production-loading-shell {
        position: relative;
        min-height: 260px;
        flex: 1 1 auto;
        border: 1px solid var(--mis-border);
        border-radius: 8px;
        background: var(--mis-surface);
        overflow: hidden;
      }

      .production-status {
        padding: 18px;
        color: var(--mis-muted);
        font-size: var(--ei-fs-sm);
        text-align: center;
      }

      .production-summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(124px, 1fr));
        gap: 6px;
      }

      .production-summary-card {
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        padding: 5px 9px;
        border: 1px solid var(--mis-divider);
        border-radius: 6px;
        background: var(--mis-surface-soft);
      }

      .production-summary-title {
        color: var(--mis-muted);
        font-size: var(--ei-fs-2xs);
        font-weight: 600;
        letter-spacing: 0.02em;
        line-height: 1.25;
      }

      .production-summary-value {
        color: var(--mis-text-secondary);
        font-size: var(--ei-fs-md);
        font-weight: var(--sasv-fw-semibold);
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      /* Overdue WIP: a quiet accent edge and value tint, no filled warning panel. */
      .production-summary-card.warning {
        border-left: 3px solid var(--mis-warning-border);
      }

      .production-summary-card.warning .production-summary-value {
        color: var(--mis-warning);
      }


      /* Production value (canonical G7 RPC): compact ERP cards, semantic tokens only. */
      .pv {
        margin: 0 0 8px;
        border: 1px solid var(--mis-border);
        border-radius: 8px;
        background: var(--mis-surface);
        padding: 8px 10px 10px;
      }
      .pv-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px 12px;
        margin-bottom: 6px;
      }
      .pv-heading {
        margin: 0;
        color: var(--mis-text);
        font-size: var(--ei-fs-sm);
        font-weight: var(--sasv-fw-semibold);
        letter-spacing: 0.02em;
      }
      .pv-controls { display: flex; flex-wrap: wrap; gap: 6px; }
      .pv-field {
        display: flex;
        align-items: center;
        gap: 5px;
        color: var(--mis-muted);
        font-size: var(--ei-fs-2xs);
        font-weight: var(--sasv-fw-semibold);
      }
      .pv-input {
        min-height: 30px;
        padding: 3px 8px;
        border: 1px solid var(--mis-search-border);
        border-radius: 6px;
        background: var(--mis-search-bg);
        color: var(--mis-text);
        font: inherit;
        font-size: var(--ei-fs-xs);
      }
      .pv-input:hover { border-color: var(--mis-accent); }
      .pv-input:focus-visible,
      .pv-notes summary:focus-visible,
      .production-diagnostics summary:focus-visible {
        outline: 2px solid var(--mis-accent);
        outline-offset: 1px;
      }
      .pv-asof-status { margin: 0 0 6px; color: var(--mis-muted); font-size: var(--ei-fs-xs); line-height: 1.6; }
      .pv-asof-status b { color: var(--mis-text); font-weight: var(--sasv-fw-semibold); }
      .pv-asof-clear { margin-left: 6px; min-height: 24px; }
      .pv-asof-notice {
        margin-top: 3px;
        padding: 3px 8px;
        border: 1px solid var(--mis-warning-border);
        border-radius: 6px;
        background: var(--mis-warning-bg);
        color: var(--mis-warning);
      }
      .pv-basis { margin-bottom: 6px; color: var(--mis-muted); font-size: var(--ei-fs-xs); line-height: 1.5; }
      .pv-basis b { color: var(--mis-text); font-weight: var(--sasv-fw-semibold); }
      .pv-kpi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 6px;
      }
      .pv-kpi {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        padding: 7px 10px;
        border: 1px solid var(--mis-accent-soft-border);
        border-left: 3px solid var(--mis-accent);
        border-radius: 6px;
        background: var(--mis-surface-soft);
      }
      .pv-kpi.book { border-style: dashed; border-left-style: solid; }
      .pv-kpi.unavailable { border-left-color: var(--mis-border); }
      .pv-kpi-title { color: var(--mis-muted); font-size: var(--ei-fs-2xs); font-weight: var(--sasv-fw-semibold); letter-spacing: 0.02em; }
      .pv-kpi-value { color: var(--mis-text); font-size: var(--ei-fs-lg); font-weight: var(--sasv-fw-bold); line-height: 1.2; overflow-wrap: anywhere; }
      .pv-kpi.unavailable .pv-kpi-value { color: var(--mis-muted); font-size: var(--ei-fs-md); font-weight: var(--sasv-fw-semibold); }
      .pv-kpi-badge {
        align-self: flex-start;
        padding: 1px 7px;
        border: 1px solid var(--mis-info-border);
        border-radius: 999px;
        background: var(--mis-info-bg);
        color: var(--mis-info);
        font-size: var(--ei-fs-2xs);
        font-weight: var(--sasv-fw-semibold);
      }
      .pv-kpi-caption { color: var(--mis-muted); font-size: var(--ei-fs-2xs); line-height: 1.4; }
      .pv-achievement {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 2px 8px;
        margin-top: 6px;
        padding: 5px 10px;
        border: 1px solid var(--mis-divider);
        border-radius: 6px;
        font-size: var(--ei-fs-xs);
      }
      .pv-achievement-label { color: var(--mis-muted); font-weight: var(--sasv-fw-semibold); }
      .pv-achievement-value { color: var(--mis-text); font-weight: var(--sasv-fw-bold); }

      /* ---------------------------------------------------------------------------------------------------------------

      .production-summary-grid, .pv-kpi-grid {

        border: 1px solid var(--mis-border); border-radius: var(--sasv-radius-md, 8px); background: var(--mis-divider); overflow: hidden;
      }

      @media (max-width: 359px) { .pv-kpi-grid { grid-template-columns: minmax(0, 1fr); } }

      /* Executive Summary: the first clickable cross-functional card. Subtle fill from the semantic accent-soft token. */

      .ei-fresh-group dl { margin: 0; display: grid; gap: 1px; border: 1px solid var(--mis-border); border-radius: var(--sasv-radius-sm, 6px); background: var(--mis-divider); overflow: hidden; }

      .ei-col-neg { background: var(--mis-danger); }

      @media (max-width: 640px) {

      }

      /* EI-R5 maturity: inline data bars, infinite-scroll footer, compact record cards + detail dialog (tokens only) */
      /* Finance: compact label/value rows, full signed amount stays on one line. */
      #financeMetrics .ei-metrics { grid-template-columns: minmax(0, 1fr); gap: 0; border: 1px solid var(--mis-border); border-radius: var(--sasv-radius-md, 8px); overflow: hidden; }
      #financeMetrics .ei-metric { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0 8px; padding: 2px 9px; border: 0; border-radius: 0; border-bottom: 1px solid var(--mis-divider); }
      #financeMetrics .ei-metric:last-child { border-bottom: 0; background: var(--mis-surface-soft); }
      #financeMetrics .ei-metric-value { margin: 0; white-space: nowrap; overflow-wrap: normal; text-align: right; font-variant-numeric: tabular-nums; font-size: var(--ei-fs-sm); }
      #financeMetrics .ei-metric-label { line-height: 1.2; }
      #financeMetrics .ei-metric-sub { grid-column: 1 / -1; margin: 0; }

      .ei-line-plot { display: block; width: 100%; height: 100px; overflow: visible; }

      .ei-line-plot .ei-line-partial { stroke-dasharray: 4 3; }

      .ei-dbar > span { display: block; height: 100%; background: var(--mis-accent); }
      td.num .ei-dbar { margin-left: auto; width: 100%; max-width: 120px; }
      .kpi-bar { display: grid; gap: 2px; margin-top: 4px; }
      .kpi-bar .ei-dbar { margin-top: 0; }
      .kpi-barnote { font-size: var(--ei-fs-2xs); color: var(--mis-muted); line-height: 1.3; }
      .ei-more { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 6px; font-size: var(--ei-fs-xs); color: var(--mis-muted); }
      .ei-more.error { color: var(--mis-danger); flex-wrap: wrap; }

      .ei-rc-list { list-style: none; margin: 0; padding: 6px; display: grid; gap: 6px; }

      .ei-rc:nth-child(even) .ei-rc-btn { background: var(--mis-surface-soft); }
      .ei-rc-btn:hover, .ei-rc-btn:active { border-color: var(--mis-accent); background: var(--mis-accent-soft); }
      .ei-rc-btn:focus-visible { outline: 2px solid var(--mis-focus-ring); outline-offset: 1px; }
      .ei-rc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; min-width: 0; }
      .ei-rc-title { font-size: var(--ei-fs-sm); font-weight: var(--sasv-fw-semibold); overflow-wrap: anywhere; min-width: 0; }

      .ei-rc-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; font-size: var(--ei-fs-xs); color: var(--mis-text-secondary); }

      .ei-rc-go { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--mis-muted); font-size: var(--ei-fs-md); line-height: 1; }
      .ei-rec-overlay { position: fixed; inset: 0; z-index: 2300; display: flex; align-items: center; justify-content: center; padding: var(--sasv-space-3, 12px); background: color-mix(in srgb, var(--mis-text) 35%, transparent); }
      .ei-rec-overlay[hidden] { display: none; }
      .ei-rec-dialog { display: flex; flex-direction: column; width: min(520px, 100%); max-height: 100%; border: 1px solid var(--mis-border); border-radius: var(--sasv-radius-md, 8px); background: var(--mis-surface); box-shadow: var(--sasv-shadow-lg); overflow: hidden; }

      /* EI-R7 design-language parity with the SASV reference modules (Stock Checker, Costing Suite, PEC): semantic tokens only.
         Reference values (computed): Inter via --sasv-font-sans; title 1.125rem/600/-0.01em/1.25 in --sasv-text; sub 13px muted; labels 600,
         never 700/800; table header 12px/600/0.02em uppercase muted on the soft surface; 12px is the smallest text; ink and surfaces from --sasv-*. */
      button, input, select, textarea { font-family: inherit; }
      .header-card .page-header { padding-bottom: 10px; border-bottom: 1px solid var(--sasv-divider); } /* R8: Stock & Purchase Explorer shell */
