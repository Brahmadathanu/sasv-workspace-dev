<!DOCTYPE html>
<html lang="en" data-sasv-theme="sasv-core">
  <head>
    <meta charset="UTF-8" />
    <title>SASV WORKSPACE | PM Rebuild Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/sasv-pm-rebuild-dashboard.css" />
  </head>
  <body
    class="sasv-module sasv-module--app sasv-pm-rebuild-dashboard"
    data-theme="system"
  >
    <div class="header-card">
      <header class="page-header">
        <div class="pmr-header-copy">
          <h1 class="sasv-module-title">PM Rebuild Dashboard</h1>
          <p class="page-sub">
            Review Packing Material planning vs issues and run rebuilds after
            template changes.
          </p>
        </div>
        <div class="header-actions">
          <button type="button" id="homeBtn">HOME</button>
        </div>
      </header>
    </div>

    <div class="pmr-workspace-strip" id="pmrWorkspaceStrip">
      <div class="filter-pair">
        <label for="horizonMonth">Month</label>
        <input id="horizonMonth" type="month" />
      </div>
    </div>

    <div id="filters" class="filter-strip">
      <div class="filter-pair pmr-plm-filter">
        <label for="plmFilter">PLM</label>
        <select id="plmFilter" aria-label="PLM item filter">
          <option value="">-- All PLM items --</option>
        </select>
      </div>

      <div class="filter-pair">
        <label
          ><input id="filterUnassigned" type="checkbox" /> Only with unassigned
          issues</label
        >
      </div>

      <div class="filter-pair">
        <label
          ><input id="filterApprox" type="checkbox" /> Only with approximate
          allocations</label
        >
      </div>

      <div class="filter-pair">
        <label
          ><input id="filterNetNonZero" type="checkbox" /> Only with net ≠
          0</label
        >
      </div>

      <div class="filter-pair" style="flex: 1 1 240px">
        <input
          id="textSearch"
          type="text"
          placeholder="Search PLM or top consumer products"
        />
      </div>

      <div class="filter-actions">
        <button type="button" id="clearFilters" class="link-btn">Clear</button>
        <div id="rowCount">0</div>
      </div>
    </div>

    <div class="pmr-actions-block">
      <div class="actions">
        <button type="button" id="dryRunAllBtn" class="btn-secondary">
          Dry run (All)
        </button>
        <button type="button" id="rebuildAllBtn" class="btn-primary">
          Rebuild All
        </button>
        <button type="button" id="refreshBtn" class="link-btn">Refresh</button>
      </div>
    </div>

    <div class="pmr-main">
      <div id="summaryContainer">
        <table id="plmOverviewTable">
          <thead>
            <tr>
              <th data-key="plm">PLM Item</th>
              <th data-key="planned_total_qty">Planned</th>
              <th data-key="issued_total_qty">Issued</th>
              <th data-key="net_requirement">Net</th>
              <th data-key="flags">Flags</th>
              <th data-key="top_consumers">Top consumers</th>
              <th data-key="actions">Actions</th>
            </tr>
          </thead>
          <tbody id="plmOverviewBody"></tbody>
        </table>
      </div>
    </div>

    <div
      id="dryRunPanel"
      class="detail-panel"
      style="margin-top: 12px; display: none"
    >
      <div class="muted" id="dryRunHeader">Dry run result</div>
      <div id="dryRunBody" style="margin-top: 8px"></div>
    </div>

    <script type="module" src="js/pm-rebuild-dashboard.js"></script>
  </body>
</html>
