<!DOCTYPE html>
<html lang="en" data-sasv-theme="sasv-core">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SASV WORKSPACE | Manage Season Profiles</title>
  <link rel="stylesheet" href="public/shared/css/style.css" />
</head>
<body class="sasv-module" data-theme="system">
  <div class="sasv-module-shell">
    <header class="sasv-module-header header-bar">
      <div class="sasv-module-heading">
        <h1 class="sasv-module-title">Season Profiles</h1>
      </div>
      <button type="button" id="homeIcon" class="action-link" title="Home" aria-label="Home"></button>
    </header>

    <section class="list">
      <div id="profilesList"></div>
      <hr />
      <form id="profileForm">
        <div class="row">
          <input
            id="profileLabel"
            placeholder="Label (e.g. Nellikka)"
            required
          />
          <select id="profileKind">
            <option value="product">product</option>
            <option value="raw_material">raw_material</option>
          </select>
        </div>
        <div class="row">
          <input id="profileNotes" placeholder="Notes (optional)" />
        </div>
        <div class="actions">
          <button type="submit" class="btn primary">Save</button>
          <button type="button" id="cancelEdit" class="btn ghost">Cancel</button>
        </div>
      </form>
    </section>
  </div>

  <script type="module" src="js/season_profiles.js"></script>
</body>
</html>
