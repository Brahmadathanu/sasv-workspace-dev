<!DOCTYPE html>
<html lang="en" data-sasv-theme="sasv-core">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SASV WORKSPACE | Manage Sections</title>
  <link rel="stylesheet" href="public/shared/css/style.css">
</head>
<body class="sasv-module" data-theme="system">
  <div class="sasv-module-shell">
    <header class="sasv-module-header header-bar">
      <div class="sasv-module-heading">
        <h1 class="sasv-module-title">Manage Sections</h1>
      </div>
      <button type="button" id="homeIcon" class="action-link" title="Home" aria-label="Home"></button>
    </header>

    <section>
      <h3 class="sasv-module-section-title">Existing Sections</h3>
      <table id="sectionsTable">
        <thead>
          <tr><th>Section Name</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section>
      <h3 class="sasv-module-section-title">Add Section</h3>
      <form id="addSectionForm">
        <input type="text" name="section_name" placeholder="New section name" required />
        <button type="submit" class="btn primary">Add Section</button>
      </form>
    </section>
  </div>

  <div id="confirmOverlay">
    <div id="confirmBox">
      <p id="confirmMessage"></p>
      <button type="button" id="confirmYes">Yes</button>
      <button type="button" id="confirmNo">No</button>
    </div>
  </div>

  <script type="module" src="js/sections.js"></script>
</body>
</html>
