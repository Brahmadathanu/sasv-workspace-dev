<!doctype html>
<html data-sasv-theme="sasv-core">
  <head>
    <meta charset="UTF-8" />
    <title>SASV WORKSPACE | Login</title>
    <link
      rel="icon"
      href="public/shared/assets/branding/derived/favicon.ico"
      sizes="any"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="public/shared/assets/branding/derived/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="public/shared/assets/branding/derived/icon-192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="public/shared/assets/branding/derived/apple-touch-icon-180.png"
    />
    <link rel="stylesheet" href="public/shared/css/style.css" />
    <link rel="stylesheet" href="public/shared/css/seasonal-banners.css" />
    <style>
      /* Login shell — visual reference for SASV Workspace (Phase 2) */
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: var(--sasv-space-6);
        font-family: var(--sasv-font-sans);
        font-size: var(--sasv-text-md);
        color: var(--sasv-text);
        background:
          radial-gradient(
            1200px 520px at 12% -10%,
            rgba(20, 122, 108, 0.12),
            transparent 55%
          ),
          radial-gradient(
            900px 420px at 100% 0%,
            rgba(20, 122, 108, 0.06),
            transparent 50%
          ),
          linear-gradient(180deg, #f8fbfb 0%, var(--sasv-bg) 48%, #eef3f4 100%);
      }
      .login-container {
        width: min(100%, 380px);
        padding: var(--sasv-space-8) var(--sasv-space-6) var(--sasv-space-6);
        background: var(--sasv-surface);
        border: 1px solid var(--sasv-border);
        border-radius: var(--sasv-radius-xl);
        box-shadow: var(--sasv-shadow-lg);
      }
      .login-brand {
        text-align: center;
        margin-bottom: var(--sasv-space-3);
      }
      .login-brand img {
        width: 88px;
        height: 88px;
        object-fit: contain;
        display: inline-block;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .login-product {
        margin: 0 0 2px;
        text-align: center;
        font-size: var(--sasv-text-sm);
        font-weight: var(--sasv-fw-bold);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--sasv-primary);
      }
      .login-product-sub {
        margin: 0 0 var(--sasv-space-5);
        text-align: center;
        font-size: var(--sasv-text-xs);
        font-weight: var(--sasv-fw-medium);
        color: var(--sasv-text-muted);
        letter-spacing: 0.02em;
      }
      h2 {
        text-align: center;
        margin: 0 0 var(--sasv-space-5);
        font-size: var(--sasv-text-xl);
        font-weight: var(--sasv-fw-semibold);
        color: var(--sasv-text);
        letter-spacing: -0.01em;
      }
      .input-group {
        margin-bottom: var(--sasv-space-4);
      }
      .input-group label {
        display: block;
        font-size: var(--sasv-text-sm);
        font-weight: var(--sasv-fw-semibold);
        color: var(--sasv-text-secondary);
        margin-bottom: var(--sasv-space-1);
      }
      .input-group input {
        width: 100%;
        height: var(--sasv-control-lg);
        padding: 0 12px;
        border: 1px solid var(--sasv-border-strong);
        border-radius: var(--sasv-radius-md);
        font-size: var(--sasv-text-md);
        font-family: inherit;
        color: var(--sasv-text);
        background: var(--sasv-surface);
        box-sizing: border-box;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }
      .input-group input::placeholder {
        color: var(--sasv-text-muted);
      }
      .input-group input:hover {
        border-color: rgba(20, 122, 108, 0.35);
      }
      .input-group input:focus {
        outline: none;
        border-color: var(--sasv-primary);
        box-shadow: 0 0 0 3px var(--sasv-focus-ring);
      }
      .password-group input {
        padding-right: 42px;
      }
      .btn-group {
        display: flex;
        gap: var(--sasv-space-3);
        margin-top: var(--sasv-space-5);
      }
      .btn-group .btn {
        flex: 1;
        min-height: var(--sasv-control-lg);
        border-radius: var(--sasv-radius-md);
        font-weight: var(--sasv-fw-semibold);
      }
      .btn-group .btn.primary,
      .btn-group #signInBtn {
        background: var(--sasv-primary);
        border-color: var(--sasv-primary);
        color: var(--sasv-text-on-primary);
      }
      .btn-group .btn.primary:hover,
      .btn-group #signInBtn:hover {
        background: var(--sasv-primary-hover);
        border-color: var(--sasv-primary-hover);
      }

      .password-group {
        position: relative;
      }
      .password-group .icon-btn {
        position: absolute;
        right: 8px;
        top: 30px;
        border: 0;
        background: transparent;
        cursor: pointer;
        color: var(--sasv-text-muted);
        padding: 4px;
        line-height: 1;
        z-index: 2;
        border-radius: var(--sasv-radius-sm);
      }
      .password-group .icon-btn:hover {
        color: var(--sasv-primary);
      }
      .password-group .icon-btn:focus-visible {
        outline: 2px solid var(--sasv-focus-ring-strong);
        outline-offset: 2px;
      }
      .caps-hint {
        margin-top: 6px;
        font-size: var(--sasv-text-xs);
        color: var(--sasv-warning);
        display: none;
      }

      .meta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
        font-size: var(--sasv-text-sm);
        color: var(--sasv-text-secondary);
      }
      .remember input {
        margin-right: 6px;
        accent-color: var(--sasv-primary);
      }
      .reset-link,
      .reset-btn {
        background: none;
        border: none;
        padding: 0;
        color: var(--sasv-primary);
        text-decoration: underline;
        text-underline-offset: 2px;
        font-size: var(--sasv-text-sm);
        cursor: pointer;
        font-family: inherit;
      }
      .reset-link:hover,
      .reset-btn:hover {
        color: var(--sasv-primary-hover);
      }
      .aux-row {
        display: flex;
        justify-content: center;
        margin-top: var(--sasv-space-4);
      }
      .error {
        margin-top: var(--sasv-space-4);
        padding: var(--sasv-space-2) var(--sasv-space-3);
        border-radius: var(--sasv-radius-md);
        background: var(--sasv-danger-bg);
        border: 1px solid var(--sasv-danger-border);
        color: var(--sasv-danger);
        font-size: var(--sasv-text-sm);
        text-align: center;
      }
      .error:empty {
        display: none;
        padding: 0;
        border: 0;
        margin: 0;
      }

      @media (max-width: 420px) {
        body {
          padding: var(--sasv-space-4);
          align-items: flex-start;
          padding-top: 12vh;
        }
        .login-container {
          padding: var(--sasv-space-6) var(--sasv-space-4);
        }
        .btn-group {
          flex-direction: column;
        }
      }

      /* ─── Option A: Status Morph (card stays in place) ─────── */

      /* Fade out the form content before injecting the status panel */
      .login-container.lsp-active > *:not(.lsp-wrap) {
        display: none;
      }

      /* Spinner keyframe */
      @keyframes lsp-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Progress bar fill */
      @keyframes lsp-bar {
        from {
          width: 0%;
        }
        to {
          width: 100%;
        }
      }

      /* Wrapper inside the card */
      .lsp-wrap {
        padding: 4px 0 8px;
        animation: lsp-fade-in 0.25s ease;
      }
      @keyframes lsp-fade-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Mini brand header inside the card */
      .lsp-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 24px;
      }
      .lsp-brand-icon {
        width: 32px;
        height: 32px;
        border-radius: 0;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: visible;
      }
      .lsp-brand-icon img {
        display: block;
        width: 32px;
        height: 32px;
        object-fit: contain;
      }
      .lsp-brand-text {
        font-size: 0.82em;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--sasv-primary);
      }
      .lsp-brand-sub {
        font-size: 0.72em;
        color: var(--sasv-text-muted);
        letter-spacing: 0.04em;
        margin-top: 1px;
      }

      /* Step list */
      .lsp-steps {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 13px;
      }
      .lsp-step {
        display: flex;
        align-items: center;
        gap: 11px;
      }

      /* Icon circle */
      .lsp-icon {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        flex-shrink: 0;
        box-sizing: border-box;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Pending: empty ring */
      .lsp-step[data-state="pending"] .lsp-icon {
        border: 2px solid #dde3ec;
      }

      /* Active: spinning arc, primary colour */
      .lsp-step[data-state="active"] .lsp-icon {
        border: 2px solid var(--sasv-primary-100);
        border-top-color: var(--sasv-primary);
        border-right-color: var(--sasv-primary);
        animation: lsp-spin 0.65s linear infinite;
      }

      /* Done: filled circle with checkmark */
      .lsp-step[data-state="done"] .lsp-icon {
        background: var(--sasv-primary);
        border: 2px solid var(--sasv-primary);
      }
      .lsp-step[data-state="done"] .lsp-icon::after {
        content: "";
        width: 5px;
        height: 9px;
        border: 2px solid #fff;
        border-top: none;
        border-left: none;
        transform: rotate(45deg) translate(-1px, -1px);
        display: block;
      }

      /* Labels */
      .lsp-label {
        font-size: 0.875em;
        transition: color 0.2s;
      }
      .lsp-step[data-state="pending"] .lsp-label {
        color: #b0bac6;
      }
      .lsp-step[data-state="active"] .lsp-label {
        color: var(--sasv-primary);
        font-weight: 600;
      }
      .lsp-step[data-state="done"] .lsp-label {
        color: var(--sasv-text-secondary);
      }

      /* Progress bar */
      .lsp-bar-track {
        margin-top: 28px;
        height: 3px;
        background: var(--sasv-primary-100);
        border-radius: 2px;
        overflow: hidden;
      }
      .lsp-bar-fill {
        height: 100%;
        width: 0%;
        background: var(--sasv-primary);
        border-radius: 2px;
        animation: lsp-bar 1.85s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
    </style>
    <script src="public/shared/js/seasonal-banners.js" defer></script>
  </head>
  <body>
    <div class="login-container">
      <div class="login-brand">
        <img
          src="public/shared/assets/branding/derived/app-mark-512.png"
          alt="SASV Workspace"
        />
      </div>
      <p class="login-product">SASV Workspace</p>
      <p class="login-product-sub">Manufacturing operations workspace</p>
      <h2>Sign In</h2>

      <div class="input-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="username"
        />
      </div>

      <div class="input-group password-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="icon-btn"
          id="togglePwd"
          aria-label="Show password"
          aria-pressed="false"
          title="Show/Hide password"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
        <div id="capsHint" class="caps-hint">Caps Lock is ON</div>
      </div>

      <div class="meta-row">
        <label class="remember"
          ><input type="checkbox" id="rememberMe" /> Remember me</label
        >
      </div>

      <div class="btn-group">
        <button id="signInBtn" class="btn primary">Sign In</button>
        <button id="signUpBtn" class="btn ghost">Sign Up</button>
      </div>

      <div class="aux-row">
        <button id="resetBtn" class="reset-btn">Forgot Password?</button>
      </div>

      <p id="errorMsg" class="error" role="status" aria-live="polite"></p>
    </div>

    <script type="module" src="public/shared/js/supabaseClient.js"></script>
    <script type="module" src="js/login.js"></script>
    <script type="module">
      import { initUpdaterUI } from "/public/shared/js/updater-ui.js";

      initUpdaterUI();
    </script>
  </body>
</html>
