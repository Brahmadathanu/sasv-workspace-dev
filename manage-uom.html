<!DOCTYPE html>
<html lang="en" data-sasv-theme="sasv-core">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SASV WORKSPACE | Manage UOM</title>
    <link rel="stylesheet" href="public/shared/css/style.css" />
    <link rel="stylesheet" href="css/shared-ui.css" />
    <style>
      /* Page-specific layout only (UI-MOD-1B) — UOM tabs + table */
      /* Neutralize shared-ui hard-coded blues against semantic tokens */
      body.sasv-module button.primary {
        background: var(--sasv-action-primary);
        color: var(--sasv-text-on-primary);
        border: none;
        padding: 8px 12px;
        border-radius: var(--sasv-radius-md);
        cursor: pointer;
      }
      body.sasv-module button.primary:hover {
        background: var(--sasv-action-primary-hover);
      }
      body.sasv-module button.ghost {
        background: var(--sasv-surface-soft);
        border: 1px solid var(--sasv-border);
        color: var(--sasv-text);
        padding: 8px 12px;
        border-radius: var(--sasv-radius-md);
        cursor: pointer;
      }
      body.sasv-module button.ghost:hover {
        background: var(--sasv-action-secondary-hover);
        border-color: var(--sasv-border-strong);
      }
      body.sasv-module .table {
        background: var(--sasv-surface);
        color: var(--sasv-text);
      }
      body.sasv-module input[type="text"],
      body.sasv-module input[type="number"],
      body.sasv-module select,
      body.sasv-module textarea {
        background: var(--sasv-control-bg);
        border: 1px solid var(--sasv-control-border);
        color: var(--sasv-text);
        border-radius: var(--sasv-radius-sm);
      }

      .tabs-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        margin: 12px 0;
        padding: 8px 12px;
        background: transparent;
        border-bottom: 1px solid var(--sasv-divider);
        border-radius: var(--sasv-radius-sm);
      }
      .tabs {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .tabs .tab {
        padding: 8px 12px;
        border-radius: var(--sasv-radius-md) var(--sasv-radius-md) 0 0;
        border: 1px solid transparent;
        background: transparent;
        cursor: pointer;
        font-weight: var(--sasv-fw-semibold);
        color: var(--sasv-text-muted);
        transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        white-space: nowrap;
      }
      .tabs .tab:hover {
        background: var(--sasv-surface-soft);
        color: var(--sasv-text);
      }
      .tabs .tab.active {
        background: var(--sasv-action-primary-soft);
        color: var(--sasv-action-primary);
        border-color: var(--sasv-action-primary-soft-border);
        border-bottom-color: transparent;
        box-shadow: var(--sasv-shadow-sm);
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        font-size: 1.15rem;
        border: none;
      }
      .table th,
      .table td {
        padding: 12px 14px;
        border: none;
        font-size: 1.15rem;
        text-align: center;
        vertical-align: middle;
        border-bottom: 1px solid var(--sasv-divider);
      }
      .table tbody tr:last-child td {
        border-bottom: none;
      }

      .actions .icon {
        width: 36px;
        height: 32px;
        padding: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--sasv-radius-sm);
      }
      .table td.actions,
      .table th.actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }
      .actions .icon svg {
        width: 14px;
        height: 14px;
      }
      .actions .icon:hover {
        background: var(--sasv-surface-soft);
      }

      #uomToolbar {
        margin-bottom: 8px;
      }
      #uomToolbar #rowCount {
        margin-left: auto;
        color: var(--sasv-text-muted);
      }

      /* Preserve shared-ui label|field editor grid (sasv-module .form-row is flex) */
      #editor .form-row {
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 10px;
        align-items: center;
        margin: 8px 0;
      }
      #editor .actions {
        margin-top: 10px;
      }
      #dimensionsPanel {
        margin-top: 18px;
      }
      #dimensionsPanel .toolbar {
        justify-content: space-between;
        align-items: center;
      }
      #dimensionsPanel .toolbar > div {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #dimTable {
        margin-top: 12px;
      }
      #editor {
        margin-top: 18px;
      }
    </style>
  </head>
  <body class="sasv-module" data-theme="system">
    <div class="page-header">
      <div>
        <h1>Manage UOM</h1>
        <div class="page-sub">
          Manage unit of measurements and their dimensions
        </div>
      </div>
      <div class="header-actions">
        <button
          id="homeBtn"
          type="button"
          title="Home"
          aria-label="Home"
          class="icon-btn"
        ></button>
      </div>
    </div>

    <main class="panel">
      <div class="tabs-wrap">
        <div id="subTabs" class="tabs">
          <button id="tabUoms" class="tab active" type="button">UOMs</button>
          <button id="tabDims" class="tab" type="button">Dimensions</button>
        </div>
      </div>

      <div id="uomToolbar" class="toolbar">
        <button id="btnAdd" class="primary" type="button">New UOM</button>
        <span id="rowCount"></span>
      </div>

      <table class="table" id="uomTable" aria-label="UOM list">
        <thead>
          <tr>
            <th style="width: 120px">Code</th>
            <th>Dimension</th>
            <th style="width: 120px">Is Base?</th>
            <th style="width: 220px">Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <section id="dimensionsPanel" style="display: none">
        <h3>New UOM Dimension</h3>
        <div class="toolbar">
          <div>
            <input id="dimName" type="text" placeholder="Name (e.g., Mass)" />
            <input id="dimNotes" type="text" placeholder="Optional notes" />
          </div>
          <div>
            <button id="btnAddDim" class="primary" type="button">
              Add Dimension
            </button>
          </div>
        </div>
        <table class="table" id="dimTable">
          <thead>
            <tr>
              <th style="width: 80px">ID</th>
              <th>Name</th>
              <th>Notes</th>
              <th style="width: 160px">Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section id="editor" style="display: none">
        <h3 id="editorTitle">New UOM</h3>
        <div class="form-row">
          <label for="code">Code</label>
          <input id="code" type="text" placeholder="e.g., Kg, L, Nos, g, mL" />
        </div>
        <div class="form-row">
          <label for="dimension_id">Dimension</label>
          <select id="dimension_id">
            <option value="">-- Select dimension --</option>
          </select>
        </div>
        <div class="form-row">
          <label for="notes">Notes</label>
          <input id="notes" type="text" placeholder="Optional notes" />
        </div>
        <div class="form-row">
          <label for="is_base">Base</label>
          <select id="is_base">
            <option value="true" selected>True</option>
            <option value="false">False</option>
          </select>
        </div>
        <div class="actions">
          <button id="btnSave" class="primary" type="button">Save</button>
          <button id="btnCancel" class="ghost" type="button">Cancel</button>
        </div>
        <input type="hidden" id="uomId" />
      </section>
    </main>

    <script type="module" src="public/shared/js/manage-uom.js"></script>
  </body>
</html>
