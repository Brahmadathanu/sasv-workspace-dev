<!DOCTYPE html>
<html lang="en" data-sasv-theme="sasv-core">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SASV WORKSPACE | Manage Stock Items</title>
    <link rel="stylesheet" href="public/shared/css/style.css" />
    <link rel="stylesheet" href="css/shared-ui.css" />
    <style>
      /* Page-specific layout only (UI-MOD-1B) — wide table + modals */
      /* Neutralize shared-ui hard-coded blues against semantic tokens */
      body.sasv-module button.primary {
        background: var(--sasv-action-primary);
        color: var(--sasv-text-on-primary);
        border: none;
        padding: 8px 12px;
        border-radius: var(--sasv-radius-md);
        cursor: pointer;
      }
      body.sasv-module button.primary:hover {
        background: var(--sasv-action-primary-hover);
      }
      body.sasv-module button.ghost {
        background: var(--sasv-surface-soft);
        border: 1px solid var(--sasv-border);
        color: var(--sasv-text);
        padding: 8px 12px;
        border-radius: var(--sasv-radius-md);
        cursor: pointer;
      }
      body.sasv-module button.ghost:hover {
        background: var(--sasv-action-secondary-hover);
        border-color: var(--sasv-border-strong);
      }
      body.sasv-module .table {
        background: var(--sasv-surface);
        color: var(--sasv-text);
      }
      body.sasv-module input[type="text"],
      body.sasv-module input[type="number"],
      body.sasv-module select,
      body.sasv-module textarea {
        background: var(--sasv-control-bg);
        border: 1px solid var(--sasv-control-border);
        color: var(--sasv-text);
        border-radius: var(--sasv-radius-sm);
      }

      /* Viewport-flex main column under sasv-module--app */
      .stock-items-main {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
        margin-bottom: 0;
        overflow: hidden;
        padding: 12px 16px;
        box-sizing: border-box;
      }

      .toolbar {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
        flex-shrink: 0;
        margin: 0;
      }
      .toolbar-row {
        display: flex;
        gap: 8px;
        align-items: center;
        width: 100%;
      }
      .toolbar-row.top {
        flex-wrap: wrap;
      }
      .toolbar-row.bottom {
        align-items: center;
      }
      #q {
        max-width: 360px;
      }
      #filterCategory,
      #filterSubcategory,
      #filterGroup,
      #filterSubgroup {
        max-width: 220px;
      }
      #btnResetFilters {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: var(--sasv-radius-sm);
        margin-left: 6px;
        padding: 0;
      }
      #rowCount {
        color: var(--sasv-text-muted);
        margin-left: auto;
      }
      #paginator {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        border: none;
        table-layout: auto;
      }
      .table-wrap {
        width: 100%;
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
      }
      .table-inner {
        min-width: 880px;
      }
      .table th {
        padding: 12px 14px;
        border: none;
        text-align: center;
        vertical-align: middle;
        border-bottom: 1px solid var(--sasv-divider);
        font-size: 15px;
      }
      .table td {
        padding: 12px 14px;
        border: none;
        text-align: center;
        vertical-align: middle;
        border-bottom: 1px solid var(--sasv-divider);
        font-size: 14px;
      }
      .table tbody tr:last-child td {
        border-bottom: none;
      }
      .table th,
      .table td {
        text-align: center !important;
        vertical-align: middle !important;
      }
      .table td.actions {
        white-space: nowrap;
        text-align: center;
        vertical-align: middle;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .table th:last-child,
      .table td:last-child {
        text-align: center !important;
        width: 120px;
        min-width: 120px;
      }
      .table thead th {
        position: sticky;
        top: 0;
        background: var(--sasv-surface-soft);
        z-index: 4;
        color: var(--sasv-text-muted);
      }

      #pageSizeSel {
        width: 72px;
        padding: 4px 6px;
        font-size: 13px;
        border-radius: var(--sasv-radius-sm);
        border: 1px solid var(--sasv-control-border);
        background: var(--sasv-control-bg);
        color: var(--sasv-text);
        flex: 0 0 auto;
      }

      .actions .icon {
        width: 36px;
        height: 32px;
        padding: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--sasv-radius-sm);
      }

      .kebab-btn {
        width: 34px;
        height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--sasv-radius-sm);
        background: transparent;
        border: none;
        cursor: pointer;
        margin: 0 auto;
      }
      .kebab-btn svg {
        display: block;
        pointer-events: none;
      }

      .action-menu {
        position: absolute;
        right: 0;
        top: 38px;
        min-width: 160px;
        background: var(--sasv-surface);
        border: 1px solid var(--sasv-border);
        border-radius: var(--sasv-radius-md);
        box-shadow: var(--sasv-shadow-lg);
        padding: 6px;
        z-index: var(--sasv-z-dropdown);
        display: none;
        overflow: hidden;
      }
      .action-menu[aria-hidden="false"] {
        display: block;
      }
      .action-menu button,
      .action-menu button[role="menuitem"] {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 8px 10px;
        background: transparent;
        border: none;
        text-align: left;
        color: var(--sasv-text);
        cursor: pointer;
        border-radius: var(--sasv-radius-sm);
      }
      .action-menu button:hover,
      .action-menu button[role="menuitem"]:hover,
      .action-menu button[role="menuitem"]:focus {
        background: var(--sasv-surface-soft);
        color: var(--sasv-action-primary);
        outline: none;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .grid-2 .full {
        grid-column: 1 / -1;
      }

      #editor {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(15, 40, 42, 0.45);
        z-index: var(--sasv-z-modal);
        padding: 20px;
      }
      #editor .modal-dialog,
      .modal-overlay .modal-dialog {
        width: 640px;
        max-width: 96vw;
        background: var(--sasv-surface);
        border-radius: var(--sasv-radius-lg);
        box-shadow: var(--sasv-shadow-lg);
        padding: 18px;
        border: 1px solid var(--sasv-border);
      }
      .modal-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(15, 40, 42, 0.45);
        z-index: var(--sasv-z-modal);
        padding: 20px;
      }
      .modal-dialog .modal-header,
      .modal-overlay .modal-dialog .modal-header,
      #editor .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        gap: 8px;
      }
      .modal-dialog .modal-close,
      .modal-overlay .modal-dialog .modal-close,
      #editor .modal-close {
        background: transparent;
        border: none;
        font-size: 1rem;
        padding: 6px 8px;
        cursor: pointer;
        color: var(--sasv-text-muted);
      }
      .modal-overlay .modal-dialog .form-row,
      #editor .modal-dialog .form-row {
        display: flex !important;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        margin: 8px 0;
      }
      #editor .modal-dialog .form-row label {
        margin: 0;
        font-size: 0.95rem;
        color: var(--sasv-text-muted);
      }
      .modal-overlay .modal-dialog .actions,
      #editor .modal-dialog .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }
      .modal-overlay .modal-dialog .actions .primary,
      #editor .modal-dialog .actions .primary {
        margin-left: auto;
      }
      .muted {
        color: var(--sasv-text-muted);
      }

      @media (max-width: 640px) {
        #editor .modal-dialog .grid-2 {
          grid-template-columns: 1fr !important;
        }
        #editor .modal-dialog .grid-2 .full {
          grid-column: 1 / -1 !important;
        }
      }
    </style>
  </head>
  <body class="sasv-module sasv-module--app" data-theme="system">
    <div class="page-header">
      <div>
        <h1>Manage Stock Items</h1>
        <div class="page-sub">
          Manage stock items and inventory classifications. Control categories,
          sub-categories, groups, and sub-groups.
        </div>
      </div>
      <div class="header-actions">
        <button
          id="homeBtn"
          type="button"
          title="Home"
          aria-label="Home"
          class="icon-btn"
        ></button>
      </div>
    </div>

    <main class="panel stock-items-main">
      <div class="toolbar">
        <div class="toolbar-row top">
          <input id="q" type="text" placeholder="Search code or name…" />
          <select id="filterCategory" title="Filter by Category"></select>
          <select
            id="filterSubcategory"
            title="Filter by Sub-category"
          ></select>
          <select id="filterGroup" title="Filter by Group"></select>
          <select id="filterSubgroup" title="Filter by Sub-group"></select>
          <button
            id="btnResetFilters"
            class="ghost"
            type="button"
            title="Reset filters"
            aria-label="Reset filters"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
              <path d="M21 3v5h-5" />
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
              <path d="M3 21v-5h5" />
            </svg>
          </button>
          <span id="rowCount"></span>
        </div>

        <div class="toolbar-row bottom">
          <button id="btnNew" class="primary" type="button">
            New Stock Item
          </button>
          <div id="paginator"></div>
        </div>
      </div>

      <div class="table-wrap">
        <div class="table-inner">
          <table class="table" id="tbl">
            <thead>
              <tr>
                <th>Code</th>
                <th>Name</th>
                <th>UOM</th>
                <th>Category</th>
                <th>Sub-category</th>
                <th>Group</th>
                <th>Sub-group</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <section id="editor" style="display: none">
        <div
          class="modal-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="editorTitle"
        >
          <div class="modal-header">
            <h3 id="editorTitle">New Stock Item</h3>
            <button
              class="modal-close"
              id="editorClose"
              type="button"
              aria-label="Close"
            >
              ✕
            </button>
          </div>
          <div class="grid-2">
            <div class="form-row full">
              <label for="name">Name</label>
              <input id="name" type="text" placeholder="Item name" />
            </div>
            <div class="form-row">
              <label for="uom">Default UOM</label>
              <select id="uom"></select>
            </div>
            <div class="form-row">
              <label for="active">Active</label>
              <select id="active">
                <option value="true" selected>True</option>
                <option value="false">False</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <label for="notes">Notes</label>
            <textarea
              id="notes"
              rows="3"
              placeholder="Optional notes…"
            ></textarea>
          </div>
          <div class="actions">
            <button id="btnCancel" class="ghost" type="button">Cancel</button>
            <button id="btnSave" class="primary" type="button">Save</button>
          </div>
          <input type="hidden" id="rowId" />
        </div>
      </section>

      <section id="confirmModal" class="modal-overlay" style="display: none">
        <div
          class="modal-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="confirmTitle"
        >
          <div class="modal-header">
            <h3 id="confirmTitle">Confirm</h3>
            <button
              id="confirmClose"
              class="modal-close"
              type="button"
              aria-label="Close"
            >
              ✕
            </button>
          </div>
          <div class="form-row" style="margin: 8px 0">
            <p id="confirmMessage" class="muted">Are you sure?</p>
          </div>
          <div class="actions">
            <button id="confirmCancel" class="ghost" type="button">
              Cancel
            </button>
            <button id="confirmOk" class="primary" type="button">
              Confirm
            </button>
          </div>
        </div>
      </section>

      <section id="catPopover" class="modal-overlay" style="display: none">
        <div
          class="modal-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="catPopoverTitle"
        >
          <div class="modal-header">
            <h3 id="catPopoverTitle">Assign Category</h3>
            <button
              id="catClose"
              class="modal-close"
              type="button"
              aria-label="Close"
            >
              ✕
            </button>
          </div>
          <p class="muted" id="catFor">Item: —</p>
          <div class="form-row">
            <label for="cat">Category</label>
            <select id="cat"></select>
          </div>
          <div class="form-row">
            <label for="subcat">Sub-category</label>
            <select id="subcat"></select>
          </div>
          <div class="form-row">
            <label for="grp">Group</label>
            <select id="grp"></select>
          </div>
          <div class="form-row">
            <label for="sgrp">Sub-group</label>
            <select id="sgrp"></select>
          </div>
          <div class="actions">
            <button id="btnCatClear" class="ghost" type="button">
              Clear Mapping
            </button>
            <button id="btnCatSave" class="primary" type="button">
              Save Mapping
            </button>
          </div>
          <input type="hidden" id="catRowId" />
        </div>
      </section>
    </main>

    <script type="module" src="public/shared/js/manage-stock-items.js"></script>
  </body>
</html>
