<!DOCTYPE html>
<html lang="en" data-sasv-theme="sasv-core">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SASV WORKSPACE | Manage Plant/Machinery</title>
  <link rel="stylesheet" href="public/shared/css/style.css">
</head>
<body class="sasv-module" data-theme="system">
  <div class="sasv-module-shell">
    <header class="sasv-module-header header-bar">
      <div class="sasv-module-heading">
        <h1 class="sasv-module-title">Manage Plant/Machinery</h1>
      </div>
      <button type="button" id="homeIcon" class="action-link" title="Home" aria-label="Home"></button>
    </header>

    <div class="filters">
      <select id="sectionSelect"><option value="">-- Section --</option></select>
      <select id="subSectionSelect" disabled><option value="">-- Sub-section --</option></select>
      <select id="areaSelect" disabled><option value="">-- Area --</option></select>
      <select id="typeSelect"><option value="">-- Type --</option></select>
      <button type="button" id="clearFilters">Clear</button>
    </div>

    <section>
      <h3 class="sasv-module-section-title">Existing Plant/Machinery</h3>
      <div id="plantsTableContainer">
        <table id="plantsTable">
          <thead>
            <tr>
              <th>Plant Name</th>
              <th>Type</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="add-section">
      <h3 class="sasv-module-section-title">Add Plant/Machinery Entries</h3>
      <table id="multiPlantTable">
        <thead>
          <tr><th>Plant Name</th><th>Type</th><th>Status</th><th> </th></tr>
        </thead>
        <tbody>
          <tr>
            <td><input type="text" class="m-name" /></td>
            <td>
              <select class="m-type">
                <option value="">-- Type --</option>
              </select>
            </td>
            <td>
              <select class="m-status">
                <option value="">Status</option>
                <option value="O">Operational</option>
                <option value="N">Non-operational</option>
              </select>
            </td>
            <td>
              <div class="row-controls">
                <button type="button" class="row-add" title="Add row">＋</button>
                <button type="button" class="row-remove" title="Remove row">－</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="controls">
        <button type="button" id="multiAddBtn" class="btn primary">Add All</button>
        <button type="button" id="multiClearBtn" class="btn ghost">Clear</button>
      </div>
    </section>
  </div>

  <div id="previewOverlay">
    <div id="previewBox">
      <h3>Confirm Entries</h3>
      <table id="previewTable">
        <thead>
          <tr><th>#</th><th>Plant Name</th><th>Type</th><th>Status</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="modal-actions">
        <button type="button" id="previewCancel" class="btn ghost">Edit</button>
        <button type="button" id="previewConfirm" class="btn primary">Confirm</button>
      </div>
    </div>
  </div>

  <div id="dialogOverlay">
    <div id="dialogBox">
      <div id="dialogMessage"></div>
      <div id="dialogButtons">
        <button type="button" id="btnYes">Yes</button>
        <button type="button" id="btnNo">No</button>
        <button type="button" id="btnOk">OK</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/plants.js"></script>
</body>
</html>
