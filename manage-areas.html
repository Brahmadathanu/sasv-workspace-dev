<!DOCTYPE html>
<html lang="en" data-sasv-theme="sasv-core">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SASV WORKSPACE | Manage Areas</title>
  <link rel="stylesheet" href="public/shared/css/style.css">
</head>
<body class="sasv-module" data-theme="system">
  <div class="sasv-module-shell">
    <header class="sasv-module-header header-bar">
      <div class="sasv-module-heading">
        <h1 class="sasv-module-title">Manage Areas</h1>
      </div>
      <button type="button" id="homeIcon" class="action-link" title="Home" aria-label="Home"></button>
    </header>

    <section class="form-inline">
      <label for="sectionSelect">Section:</label>
      <select id="sectionSelect">
        <option value="">-- Select Section --</option>
      </select>
      <label for="subSectionSelect">Sub-section:</label>
      <select id="subSectionSelect" disabled>
        <option value="">-- Select Sub-section --</option>
      </select>
    </section>

    <section>
      <h3 class="sasv-module-section-title">Existing Areas</h3>
      <table id="areasTable">
        <thead>
          <tr><th>Area Name</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section>
      <h3 class="sasv-module-section-title">Add Area</h3>
      <form id="addAreaForm">
        <input type="text" name="area_name" placeholder="New area name" required />
        <button type="submit" class="btn primary">Add</button>
      </form>
    </section>
  </div>

  <div id="confirmOverlay">
    <div id="confirmBox">
      <p id="confirmMessage"></p>
      <button type="button" id="confirmYes">Yes</button>
      <button type="button" id="confirmNo">No</button>
    </div>
  </div>

  <script type="module" src="js/areas.js"></script>
</body>
</html>
