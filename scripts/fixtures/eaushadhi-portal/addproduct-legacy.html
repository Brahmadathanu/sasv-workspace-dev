<!DOCTYPE html>
<html>
  <head><title>Add Product For Legacy</title></head>
  <body>
    <a id="logoutForm" href="/logout">Logout</a>
    <a href="/admin/custom_dashboard1">Dashboard</a>
    <a href="/admin/changepassword">Change Password</a>
    <button type="button" id="profile">SYNTH_LICENSE_USER_999</button>
    <a id="lnkUpdateProfile" href="/admin/updateprofile">Update Profile</a>
    <form id="productForm" method="post" action="/admin/addproductforlegacy">
      <input type="hidden" id="actiontype" name="actiontype" value="must-not-capture" />
      <label for="categoryId">Category</label>
      <select id="categoryId" name="categoryId" class="select2-hidden-accessible" data-select2-id="categoryId">
        <option value="-1">--Select--</option>
      </select>
      <span class="select2 select2-container"></span>
      <label for="subTypeId">Sub Type</label>
      <select
        id="subTypeId"
        name="subTypeId"
        class="select2-hidden-accessible"
        data-select2-id="subTypeId"
        required
        aria-required="true"
        aria-describedby="subTypeHelp"
      >
        <option value="-1" selected>--Select--</option>
      </select>
      <span id="subTypeHelp" class="field-validation-help">Please Select a Sub Type when required.</span>
      <span class="select2 select2-container"></span>
      <label for="countryApplicable">Country Applicable</label>
      <select id="countryApplicable" name="countryApplicable" class="select2-hidden-accessible" data-select2-id="countryApplicable">
        <option value="0">--Select Option--</option>
      </select>
      <span class="select2 select2-container"></span>
      <label for="type">Type</label>
      <select id="type" name="type">
        <option value="-1">Ayurveda Classical</option>
      </select>
      <label for="permissionPurpose">Permission Purpose</label>
      <select id="permissionPurpose" name="permissionPurpose">
        <option value="11">For sale</option>
      </select>
      <label for="indications">Pharmacological Actions</label>
      <select id="indications" name="indications" class="select2-hidden-accessible" multiple data-select2-id="indications">
        <option value="101">Deepana</option>
        <option value="102" selected>Pachana</option>
      </select>
      <span class="select2 select2-container"></span>
      <ul class="select2-results__options">
        <li id="select2-indications-result-abcd-999" class="select2-results__option">Ignore generated id</li>
      </ul>
      <label for="compositionTitle">Composition Title</label>
      <input id="compositionTitle" name="compositionTitle" type="text" />
      <label for="disease">Diseases and Conditions</label>
      <textarea id="disease" name="disease"></textarea>
      <button type="submit" id="save_btn" onclick="window.__EA_CAPTURE_HANDLER_FIRED=true; alert('bearer PLANTED_SECRET_TOKEN_SHOULD_NOT_PERSIST')">Save</button>
      <button type="submit" id="save_rbtn" onclick="window.__EA_CAPTURE_HANDLER_FIRED=true">Save</button>
    </form>
    <script>
      // Generic subtype + validation language WITHOUT a "-1" comparison.
      function noteSubTypeFieldRequired() {
        return "Sub Type field is required when category is selected";
      }
    </script>
    <script>
      // Direct subtype + "-1" comparison/rejection candidate for observational capture.
      function validateSubTypeBeforeSave() {
        var el = document.getElementById("subTypeId");
        if (el && el.value === "-1") {
          return "Please Select Sub Type";
        }
        return null;
      }
    </script>
    <script>
      // Unrelated sentinel occurrence must not alone prove rejection.
      var GENERIC_PAGE_CODE = "-1";
    </script>
    <script src="/admin/assets/product-validation.js"></script>
  </body>
</html>
