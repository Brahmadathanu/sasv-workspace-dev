    <script>
      function SaveData() {
        var actiontype = document.getElementById("actiontype").value;
        if (actiontype == "add") {
          var jsondata = { "reportDate": reportDate, "labName": labName, "qualityCntrl": qualityCntrl, "productId": productId };
        } else {
          var jsondata = { "reportDate": reportDate, "labName": labName, "qualityCntrl": qualityCntrl, "productId": productId, "id": id };
        }
        return jsondata;
      }
      document.getElementById("sdate").addEventListener("change", () => {
