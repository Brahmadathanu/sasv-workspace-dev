name: WP05 R55 Scheme Register PPM Gate isolated PG17
on:
  pull_request:
    paths:
      - "docs/master-data-costing/candidates/WP05_R55_SCHEME_REGISTER_PPM_*.sql"
      - "scripts/wp05-r55-scheme-register/**"
      - ".github/workflows/wp05-r55-scheme-register.yml"
jobs:
  pg17:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-r55
          POSTGRES_DB: wp05_scheme_fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d wp05_scheme_fixture"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      WP05_ISOLATED_PG: "YES"
      PGHOST: "127.0.0.1"
      PGUSER: "postgres"
      PGPASSWORD: "isolated-r55"
      PGDATABASE: "wp05_scheme_fixture"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Verify exact Scheme Master register PPM reader and rollback
        run: node --test scripts/wp05-r55-scheme-register/scheme-register-pg17.test.mjs
