name: Electron v6.3.0 candidate packaging (unpublished)

on:
  pull_request:
    paths:
      - '.github/workflows/electron-v630-candidate-package.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'public/shared/js/procurement-execution-console.js'
      - 'public/shared/procurement-execution-console.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated release candidate and install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $l = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($p.version -ne '6.3.0' -or $l.version -ne '6.3.0' -or $l['packages']['']['version'] -ne '6.3.0') { throw 'Candidate package versions differ' }
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npx install-electron
          if ($LASTEXITCODE -ne 0) { throw 'Electron installation failed' }
      - name: Build Windows NSIS and ZIP without publishing
        shell: pwsh
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          $ErrorActionPreference = 'Stop'
          npx electron-builder --win nsis zip --publish never
          if ($LASTEXITCODE -ne 0) { throw 'electron-builder failed' }
      - name: Verify candidate assets and record SHA-256 hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = @(Get-ChildItem dist -File -Filter '*6.3.0*.exe')
          $zip = @(Get-ChildItem dist -File -Filter '*6.3.0*.zip')
          $block = @(Get-ChildItem dist -File -Filter '*6.3.0*.blockmap')
          $yml = Join-Path 'dist' 'latest.yml'
          if ($exe.Count -ne 1 -or $zip.Count -ne 1 -or $block.Count -lt 1 -or -not (Test-Path $yml)) { throw "Missing/ambiguous assets: exe=$($exe.Count) zip=$($zip.Count) blockmap=$($block.Count) latest=$((Test-Path $yml))" }
          $manifest = Get-Content $yml -Raw
          if ($manifest -notmatch '(?m)^version:\s*6\.3\.0\s*$') { throw 'latest.yml does not identify v6.3.0' }
          if ($manifest -notmatch [regex]::Escape($exe[0].Name)) { throw 'latest.yml does not reference expected NSIS installer' }
          $all = @($exe + $zip + $block + @(Get-Item $yml))
          $all | ForEach-Object { $h=Get-FileHash $_.FullName -Algorithm SHA256; "$($h.Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
          "Candidate $env:GITHUB_SHA; no release or updater publication" | Set-Content dist/CANDIDATE_SOURCE.txt
      - name: Upload private CI candidate (not a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: sasv-v630-unpublished-windows-candidate
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
            dist/CANDIDATE_SOURCE.txt
          retention-days: 3
          if-no-files-found: error
