name: PEC JIT route (isolated PostgreSQL 17 fixture)
on:
  pull_request:
    paths:
      - "supabase/migrations/20261122163830_pec_jit_mrp_route_plan_and_generator.sql"
      - "supabase/migrations/20261122174517_pec_jit_plan_indent_balance_once_timeout_fix.sql"
      - "scripts/pec-jit-route-pg-fixture.sql"
      - "scripts/pec-jit-route-contract.test.mjs"
      - ".github/workflows/pec-jit-route-pg17.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg17-fixture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: pec_jit_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pec_jit_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static additive-migration contract checks
        run: node --test scripts/pec-jit-route-contract.test.mjs
      - name: Isolated PostgreSQL 17 fixture - never production
        env:
          PGPASSWORD: fixture_only
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: pec_jit_fixture
        run: |
          set -eu
          psql -X -v ON_ERROR_STOP=1 -f scripts/pec-jit-route-pg-fixture.sql 2>&1 | tee "$RUNNER_TEMP/pec-jit-pg17.txt"
          grep -q PEC_JIT_ROUTE_PG_FIXTURE_PASS "$RUNNER_TEMP/pec-jit-pg17.txt"
          test "$(grep -c 'NOTICE:  ok:' "$RUNNER_TEMP/pec-jit-pg17.txt")" -ge 40
