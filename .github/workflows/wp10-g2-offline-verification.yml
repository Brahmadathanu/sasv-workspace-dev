name: WP10 G2 offline verification

on:
  pull_request:
    paths:
      - '.github/workflows/wp10-g2-offline-verification.yml'
      - 'js/categories.js'
      - 'js/subcategories.js'
      - 'js/product-groups.js'
      - 'js/subgroups.js'
      - 'manage-product-groups.html'
      - 'public/shared/js/products.js'
      - 'public/shared/js/costing-suite-readiness.js'
      - 'public/shared/js/wp10-safeguards*.js'
      - 'scripts/wp10-g2-safeguards/**'
      - 'scripts/wp10-g1-safeguard-audit/**'
      - 'scripts/wp08-g2-0-shared-master-data/pg-harness.mjs'
      - 'docs/master-data-costing/WP10_G1_EVIDENCE/*.json'
      - 'docs/master-data-costing/WP10_G2_EVIDENCE/*.json'
      - 'docs/master-data-costing/WP10_G2_UNAPPLIED_SQL_PROPOSALS/**'
      - 'docs/master-data-costing/WP10_G2_COUNTERFACTUAL_PREVIEW_CONTRACT_DRAFT_2026-11-15.md'

permissions:
  contents: read

jobs:
  wp10-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WP10_G2_BROWSER_SKIP: '0'
      WP10_G2_SHOTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch main for source-scope comparisons
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Prepare isolated test paths
        run: |
          echo "NODE_PATH=$RUNNER_TEMP/wp10deps/node_modules" >> "$GITHUB_ENV"
          echo "WP10_EVIDENCE=$RUNNER_TEMP/wp10-evidence" >> "$GITHUB_ENV"
      - name: Install isolated test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/wp10deps" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/wp10deps/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-client-16
      - name: Require PostgreSQL and Chromium test infrastructure
        run: |
          node --input-type=module -e "import {pgAvailable} from './scripts/wp08-g2-0-shared-master-data/pg-harness.mjs'; if (!pgAvailable()) throw Error('PostgreSQL unavailable; no skipped fixture PASS');"
          node -e "const fs=require('fs'); const p=require('playwright'); if (!fs.existsSync(p.chromium.executablePath())) throw Error('Chromium unavailable');"
          mkdir -p "$WP10_EVIDENCE"
      - name: Pure client, delivery, source and draft-SQL contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/wp10-g2-safeguards/verify-classification-crud-contract.mjs | tee "$WP10_EVIDENCE/classification-contract.log"
          for suite in client-units sw-delivery source draft-sql-static phase1-registration phase1-inventory; do
            node "scripts/wp10-g2-safeguards/$suite.test.mjs" | tee "$WP10_EVIDENCE/$suite.log"
          done
          # the generated proposal 06 must equal its generator output (derivation parity is asserted by draft-sql-static S19/S20)
          node scripts/wp10-g2-safeguards/gen-proposal-06.mjs && git diff --exit-code -- docs/master-data-costing/WP10_G2_UNAPPLIED_SQL_PROPOSALS/06_subgroup_impact_preview.sql
      - name: Isolated PostgreSQL fixtures and mutation controls (never Supabase)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/wp10-g2-safeguards/classification-crud-pg.test.mjs | tee "$WP10_EVIDENCE/classification-pg.log"
          for suite in horizon guards provenance preview cross-flow-concurrency parent-lock-candidate; do
            node "scripts/wp10-g2-safeguards/$suite.test.mjs" "$WP10_EVIDENCE/$suite.json" | tee "$WP10_EVIDENCE/$suite.log"
            if grep -q '^SKIPPED' "$WP10_EVIDENCE/$suite.log"; then
              echo '::error::PostgreSQL fixture skipped; gate cannot pass'
              exit 1
            fi
          done
      - name: Mocked Chromium at 390 and 1280 (not live-role acceptance)
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/wp10-g2-safeguards/browser-products.test.mjs scripts/wp10-g2-safeguards/browser-readiness.test.mjs scripts/wp10-g2-safeguards/browser-classification-access.test.mjs | tee "$WP10_EVIDENCE/chromium.log"
          if grep -Eq '^# skipped [1-9]' "$WP10_EVIDENCE/chromium.log"; then
            echo '::error::Chromium checks skipped; gate cannot pass'
            exit 1
          fi
          # the new preview suite must actually have run (a missing file or a silently empty run must not pass)
          node --test scripts/wp10-g2-safeguards/browser-preview.test.mjs | tee "$WP10_EVIDENCE/chromium-preview.log"
          if ! grep -Eq '^# pass [1-9][0-9]+' "$WP10_EVIDENCE/chromium-preview.log" || grep -Eq '^# (fail|skipped|cancelled) [1-9]' "$WP10_EVIDENCE/chromium-preview.log"; then
            echo '::error::impact-preview Chromium suite did not run to a clean pass'
            exit 1
          fi
      - name: Preserve offline logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp10-g2-offline-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/wp10-evidence/
            docs/master-data-costing/WP10_G2_EVIDENCE/screenshots/
          if-no-files-found: warn
