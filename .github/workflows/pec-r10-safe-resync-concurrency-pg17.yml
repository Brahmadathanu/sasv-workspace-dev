name: PEC R10 SAFE resync concurrency PG17
on:
  pull_request:
    paths:
      - "scripts/pec-r10/**"
      - "scripts/pec-g0-safe-collision-*.sql"
      - "supabase/migrations/*_pec_safe_resync_collision_guard_lock_order.sql"
      - ".github/workflows/pec-r10-safe-resync-concurrency-pg17.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concurrency-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Migration is the CLI-created forward-only file; history files untouched
        run: |
          set -eu
          ls supabase/migrations/*_pec_safe_resync_collision_guard_lock_order.sql
          ! grep -Eiq '\b(grant|revoke)\b' supabase/migrations/*_pec_safe_resync_collision_guard_lock_order.sql
      - name: Run guarded source + mutation-sensitive negative controls
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: fixture_only
        run: |
          set -eu
          psql -X -At -c 'select version()'
          bash scripts/pec-r10/run-ci.sh | tee "$RUNNER_TEMP/r10.txt"
          grep -q PEC_R10_CONCURRENCY_HARNESS_PASS "$RUNNER_TEMP/r10.txt"
