name: PEC R10 SAFE resync concurrency PG17
on:
  pull_request:
    paths:
      - "scripts/pec-r10/**"
      - "scripts/pec-r12-resync-collision-ux-smoke.mjs"
      - "scripts/lib/pec-fixture-stub.mjs"
      - "scripts/pec-g0-safe-collision-*.sql"
      - "supabase/migrations/*_pec_safe_resync_collision_guard_lock_order.sql"
      - "supabase/migrations/*_pec_safe_resync_collision_preview_ro.sql"
      - "supabase/migrations/*_pec_indent_set_source_pr_lock_prelude.sql"
      - "supabase/migrations/*_pec_indent_set_status_header_lock.sql"
      - "supabase/migrations/*_pec_revoke_authenticated_dml_policy_link_tables.sql"
      - ".github/workflows/pec-r10-safe-resync-concurrency-pg17.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concurrency-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Migration is the CLI-created forward-only file; history files untouched
        run: |
          set -eu
          ls supabase/migrations/*_pec_indent_set_status_header_lock.sql
          if grep -v '^[[:space:]]*--' supabase/migrations/*_pec_indent_set_status_header_lock.sql | grep -Eiq '\b(grant|revoke)\b'; then echo 'R-2 migration must not change ACLs'; exit 1; fi
          ls supabase/migrations/*_pec_safe_resync_collision_guard_lock_order.sql supabase/migrations/*_pec_safe_resync_collision_preview_ro.sql supabase/migrations/*_pec_indent_set_source_pr_lock_prelude.sql
          if grep -v '^[[:space:]]*--' supabase/migrations/*_pec_safe_resync_collision_guard_lock_order.sql supabase/migrations/*_pec_indent_set_source_pr_lock_prelude.sql | grep -Eiq '\b(grant|revoke)\b'; then echo 'guard migration must not change ACLs'; exit 1; fi
      - name: Run guarded source + mutation-sensitive negative controls
        env:
          PEC_FIXTURE_ONLY: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: fixture_only
        run: |
          set -eu
          psql -X -At -c 'select version()'
          bash scripts/pec-r10/run-ci.sh | tee "$RUNNER_TEMP/r10.txt"
          grep -q PEC_R10_CONCURRENCY_HARNESS_PASS "$RUNNER_TEMP/r10.txt"
      - name: F1 guard mutation test (stub psql, no database)
        run: bash scripts/pec-r10/guard-mutation-test.sh | tee "$RUNNER_TEMP/guard-mutation.txt"; grep -q PEC_GUARD_MUTATION_PASS "$RUNNER_TEMP/guard-mutation.txt"
      - name: F2/F4 writer matrix, real roles, risk characterisation and negative controls
        env:
          PEC_FIXTURE_ONLY: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: fixture_only
        run: |
          set -u -o pipefail
          bash scripts/pec-r10/run-fixture-suite.sh | tee "$RUNNER_TEMP/fixture-suite.txt"
          grep -q PEC_FIXTURE_SUITE_PASS "$RUNNER_TEMP/fixture-suite.txt"
      - name: Second identical run (repeatability)
        env:
          PEC_FIXTURE_ONLY: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: fixture_only
        run: |
          set -u
          bash scripts/pec-r10/run-fixture-suite.sh > "$RUNNER_TEMP/fixture-suite-2.txt"
          grep -h '^RESULT ' "$RUNNER_TEMP/fixture-suite.txt" | grep -v ' R1b ' | sed -E 's/ [0-9]+ round/ N round/' | sort > "$RUNNER_TEMP/r1.txt"
          grep -h '^RESULT ' "$RUNNER_TEMP/fixture-suite-2.txt" | grep -v ' R1b ' | sed -E 's/ [0-9]+ round/ N round/' | sort > "$RUNNER_TEMP/r2.txt"
          diff "$RUNNER_TEMP/r1.txt" "$RUNNER_TEMP/r2.txt"
          echo "REPEATABLE: identical RESULT lines on two runs"
      - name: Teardown check (no fixture database or backend left)
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: fixture_only
        run: |
          set -eu
          left=$(psql -X -At -d postgres -c "select count(*) from pg_database where datname like 'pec_r10_%'")
          echo "leftover fixture databases: $left"
          [ "$left" = 0 ]
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Playwright (client UX replay)
        run: |
          npm install --prefix "$RUNNER_TEMP/pecdeps" --no-save --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/pecdeps/node_modules/.bin/playwright" install --with-deps chromium
      - name: F3 export real server preview JSON and replay it through the client UX smoke
        env:
          PEC_FIXTURE_ONLY: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: fixture_only
          NODE_PATH: ${{ runner.temp }}/pecdeps/node_modules
        run: |
          set -eu -o pipefail
          bash scripts/pec-r10/export-golden.sh "$RUNNER_TEMP/golden"
          node scripts/pec-r12-resync-collision-ux-smoke.mjs --golden "$RUNNER_TEMP/golden" --shots "$RUNNER_TEMP/shots" | tee "$RUNNER_TEMP/ux-golden.txt"
          grep -q "replaying golden server preview JSON" "$RUNNER_TEMP/ux-golden.txt"
          ! grep -q "^FAIL" "$RUNNER_TEMP/ux-golden.txt"
      - name: Upload CI artifacts (screenshots are CI artefacts, not signed acceptance evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pec-fixture-f1-f4-evidence
          path: |
            ${{ runner.temp }}/fixture-suite.txt
            ${{ runner.temp }}/fixture-suite-2.txt
            ${{ runner.temp }}/guard-mutation.txt
            ${{ runner.temp }}/ux-golden.txt
            ${{ runner.temp }}/golden
            ${{ runner.temp }}/shots
          if-no-files-found: warn
