name: WP05 CSR PWA Freshness

on:
  pull_request:
    paths:
      - 'public/sw.js'
      - 'scripts/csr-pwa-freshness/**'
      - '.github/workflows/wp05-csr-pwa-freshness.yml'
  push:
    branches: ['fix/wp05-csr-pwa-freshness-integrated-20261111']
    paths:
      - 'public/sw.js'
      - 'scripts/csr-pwa-freshness/**'
      - '.github/workflows/wp05-csr-pwa-freshness.yml'

permissions:
  contents: read

jobs:
  mock-sw:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated service-worker regression
        run: node --test scripts/csr-pwa-freshness/*.test.mjs
