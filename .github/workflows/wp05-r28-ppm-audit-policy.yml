name: WP05 R28 PPM Audit Policy Candidate (Offline)

on:
  pull_request:
    paths:
      - "docs/master-data-costing/candidates/WP05_R28_PPM_AUDIT_OPTION_A_*.sql"
      - "scripts/wp05-r28-ppm-audit-policy/**"
      - ".github/workflows/wp05-r28-ppm-audit-policy.yml"
  push:
    branches: [main]
    paths:
      - "docs/master-data-costing/candidates/WP05_R28_PPM_AUDIT_OPTION_A_*.sql"
      - "scripts/wp05-r28-ppm-audit-policy/**"
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synthetic permission and SQL structural contract (NO DB)
        run: node --test scripts/wp05-r28-ppm-audit-policy/ppm-audit-policy.test.mjs

  pg17-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: wp05-isolated-only
          POSTGRES_DB: wp05_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wp05_fixture"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      WP05_ISOLATED_PG: "YES"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: wp05-isolated-only
      PGDATABASE: wp05_fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify isolated PostgreSQL client availability
        run: psql --version
      - name: Exercise live PostgreSQL 17 parser, synthetic roles and rollback
        run: node --test scripts/wp05-r28-ppm-audit-policy/ppm-audit-pg17-isolated.test.mjs
