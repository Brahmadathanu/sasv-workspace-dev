name: WP12 Six Costing Hosted Bundle Provenance
on:
  pull_request:
    paths:
      - '.github/workflows/wp12-six-costing-hosted-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-costing:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify publicly served Costing assets, without login or writes
        run: |
          set -euo pipefail
          node scripts/costing-acceptance/verify-served-assets.mjs https://sasv-utilities-hub.netlify.app "$(git rev-parse HEAD)" --expect-cache hub-cache-v393 --json "$RUNNER_TEMP/costing-hosted.json"
      - name: Preserve scoped result JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp12-six-costing-hosted-proof
          path: ${{ runner.temp }}/costing-hosted.json
          if-no-files-found: warn
