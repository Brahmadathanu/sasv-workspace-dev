name: WP05 W5-06 confidentiality server verification

on:
  pull_request:
    paths:
      - "supabase/migrations/20261109130000_wp05_w506_conf_01_personnel_view_gate.sql"
      - "supabase/tests/w506_conf/**"
      - "scripts/costing-w506-conf-server/**"
      - "docs/master-data-costing/prepared/WP05_W506_CONF_01_ROLLBACK.sql"
      - ".github/workflows/wp05-w506-conf-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PGPORT: "55432"
      PGUSER: "postgres"
    steps:
      - name: Checkout proposed PR source
        uses: actions/checkout@v4

      - name: Node static confidentiality checks
        run: node --test scripts/costing-w506-conf-server/migration-static.test.mjs

      - name: Install PostgreSQL 16 test binaries
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-16

      - name: Run disposable local PostgreSQL 16 confidentiality matrix
        shell: bash
        run: |
          set -euo pipefail
          BIN=/usr/lib/postgresql/16/bin
          DATA="$RUNNER_TEMP/w506-disposable-github-actions"
          SOCK="$RUNNER_TEMP/w506-test-socket"
          mkdir -p "$SOCK"
          "$BIN/initdb" -D "$DATA" -A trust -U "$PGUSER" --no-instructions
          stop_pg() { "$BIN/pg_ctl" -D "$DATA" -m immediate stop >/dev/null 2>&1 || true; }
          trap stop_pg EXIT
          "$BIN/pg_ctl" -D "$DATA" -o "-k $SOCK -p $PGPORT -c listen_addresses=''" -w start
          export PATH="$BIN:$PATH"
          export PGHOST="$SOCK"
          bash supabase/tests/w506_conf/run_view_gate_test.sh

      - name: Verify no production credentials were required
        if: always()
        run: echo "Disposable local fixture only; no production database credentials supplied."
