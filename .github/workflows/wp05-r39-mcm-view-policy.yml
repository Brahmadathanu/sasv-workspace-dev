name: WP05 R39 MCM two-view isolated policy checks
on:
  pull_request:
    paths:
      - "docs/master-data-costing/candidates/WP05_R39_MCM_TWO_VIEWS_*.sql"
      - "scripts/wp05-r39-mcm-access/**"
      - ".github/workflows/wp05-r39-mcm-view-policy.yml"
  push:
    branches: [main]
    paths:
      - "docs/master-data-costing/candidates/WP05_R39_MCM_TWO_VIEWS_*.sql"
      - "scripts/wp05-r39-mcm-access/**"
jobs:
  postgres17:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-r39-mcm
          POSTGRES_DB: wp05_mcm_fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d wp05_mcm_fixture"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      WP05_ISOLATED_PG: "YES"
      PGHOST: "127.0.0.1"
      PGPORT: "5432"
      PGUSER: "postgres"
      PGPASSWORD: "isolated-r39-mcm"
      PGDATABASE: "wp05_mcm_fixture"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Exercise complete current-view SQL, dependent fixtures, permissions and rollback
        run: node --test scripts/wp05-r39-mcm-access/mcm-views-pg17.test.mjs
