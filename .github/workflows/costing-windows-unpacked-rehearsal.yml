name: Costing Windows Unpacked Pre-Release Rehearsal (NO PUBLISH)
on:
  pull_request:
    paths:
      - '.github/workflows/costing-windows-unpacked-rehearsal.yml'
      - 'scripts/costing-release/windows-unpacked-asar-receipt.mjs'
      - 'scripts/costing-release/windows-unpacked-local-http-smoke.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-unpacked-proof:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Define exact source checkout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/costing-windows-evidence" | Out-Null
          git rev-parse HEAD | Set-Content "$env:RUNNER_TEMP/costing-windows-evidence/source-sha.txt"
          node -p "require('./package.json').version" | Set-Content "$env:RUNNER_TEMP/costing-windows-evidence/app-version.txt"
      - name: Install lockfile-pinned build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build unpacked Windows Electron app only (no NSIS/ZIP, no publish)
        shell: pwsh
        run: |
          npx electron-builder --win --dir --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "dist/win-unpacked/resources/app.asar")) { throw "Unpacked app.asar missing" }
          if (!(Test-Path "dist/win-unpacked/SASV Workspace.exe")) { throw "Unpacked executable missing" }
      - name: Check ASAR against source for Costing and classified masters
        shell: pwsh
        run: |
          node scripts/costing-release/windows-unpacked-asar-receipt.mjs --out "$env:RUNNER_TEMP/costing-windows-evidence/asar-parity.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install fail-closed outbound block for packed app before runtime test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/win-unpacked/SASV Workspace.exe").Path
          $rule = "Costing CI OFFLINE app $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-NetFirewallRule -DisplayName $rule -Direction Outbound -Action Block -Program $exe -Profile Any -Enabled True -ErrorAction Stop | Out-Null
          $actual = Get-NetFirewallRule -DisplayName $rule -ErrorAction Stop
          if ($actual.Action -ne "Block" -or $actual.Direction -ne "Outbound" -or $actual.Enabled -ne "True") { throw "Outbound app deny rule not effective" }
          "COSTING_OUTBOUND_FIREWALL_CONFIRMED=1" | Out-File -Append -FilePath $env:GITHUB_ENV
          "COSTING_FIREWALL_RULE=$rule" | Out-File -Append -FilePath $env:GITHUB_ENV
      - name: Run offline packed Electron local static server smoke
        shell: pwsh
        run: |
          if ($env:COSTING_OUTBOUND_FIREWALL_CONFIRMED -ne "1") { throw "App firewall unconfirmed: refuse launch" }
          node scripts/costing-release/windows-unpacked-local-http-smoke.mjs --out "$env:RUNNER_TEMP/costing-windows-evidence/packaged-local-http.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove isolated runner firewall rule
        if: always()
        shell: pwsh
        run: |
          if ($env:COSTING_FIREWALL_RULE) {
            Get-NetFirewallRule -DisplayName $env:COSTING_FIREWALL_RULE -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction Stop
          }
      - name: Preserve NO-PUBLISH and acceptance boundaries
        if: always()
        shell: pwsh
        run: |
          @'
          WIN-UNPACKED PRE-RELEASE REHEARSAL ONLY.
          No NSIS/ZIP installer, updater feed, release upload, code signing, production SQL or live login.
          Unpacked packaged application runtime is launched ONLY after verified per-executable outbound block; local static GET receipt is separate from signed-in UI or updater testing.
          NOT TESTED: installed NSIS/ZIP Windows app, role access, genuine user content, or updater installation/rollback.
          NOT AUTHORISED: release publication, main merge, production flag/permission changes.
          The owner-deferred combined installer remains deferred pending actual WP11/WP12 live-role acceptance.
          '@ | Set-Content "$env:RUNNER_TEMP/costing-windows-evidence/boundaries.txt"
      - name: Save JSON and source receipt only (no app executable or binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: costing-windows-unpacked-source-parity
          path: ${{ runner.temp }}/costing-windows-evidence/
          if-no-files-found: error
