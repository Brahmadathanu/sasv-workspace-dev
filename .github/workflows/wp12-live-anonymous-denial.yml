name: WP12 Hosted Anonymous Six-Costing Denial
on:
  pull_request:
    paths:
      - ".github/workflows/wp12-live-anonymous-denial.yml"
      - "scripts/wp12-live-anonymous-denial.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-anonymous:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install headless Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/wp12anon" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/wp12anon/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/wp12anon/node_modules" >> "$GITHUB_ENV"
      - name: Verify live logged-out direct routes (all GET, no business data)
        run: |
          set -euo pipefail
          node --test scripts/wp12-live-anonymous-denial.test.mjs | tee "$RUNNER_TEMP/wp12-anonymous.log"
          if grep -Eq '^# (fail|skipped|cancelled) [1-9]' "$RUNNER_TEMP/wp12-anonymous.log"; then exit 1; fi
          grep -q '^# pass 1' "$RUNNER_TEMP/wp12-anonymous.log"
      - name: Preserve anonymous no-secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp12-hosted-anonymous-direct-routes
          path: ${{ runner.temp }}/wp12-anonymous.log
          if-no-files-found: warn
