<!DOCTYPE html>
<html lang="en" data-sasv-theme="sasv-core">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SASV WORKSPACE | Manage Activities</title>
  <link rel="stylesheet" href="public/shared/css/style.css">
</head>
<body class="sasv-module" data-theme="system">
  <div class="sasv-module-shell">
    <header class="sasv-module-header header-bar">
      <div class="sasv-module-heading">
        <h1 class="sasv-module-title">Existing Activities</h1>
      </div>
      <button type="button" id="homeBtn" class="action-link" title="Home" aria-label="Home"></button>
    </header>

    <div class="filters">
      <select id="sectionFilter">
        <option value="">Sections</option>
      </select>
      <select id="subFilter" disabled>
        <option value="">Sub-sections</option>
      </select>
      <select id="areaFilter" disabled>
        <option value="">Areas</option>
      </select>
      <input type="text" id="nameFilter" placeholder="Activity name" />
      <button type="button" id="clearFilters">Clear</button>
    </div>

    <section>
      <h3 class="sasv-module-section-title">Existing Activities</h3>
      <table id="existingTable">
        <thead>
          <tr>
            <th>Activity</th>
            <th>Section</th>
            <th>Sub-section</th>
            <th>Area</th>
            <th>Duration</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section>
      <h3 class="sasv-module-section-title">Add New Activities</h3>
      <table id="multiTable">
        <thead>
          <tr>
            <th>Activity</th>
            <th>Section</th>
            <th>Sub-section</th>
            <th>Area</th>
            <th>Duration</th>
            <th> </th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><input class="m-name edit-input" /></td>
            <td>
              <select class="m-section edit-select">
                <option value="">Select…</option>
              </select>
            </td>
            <td>
              <select class="m-sub edit-select" disabled>
                <option value="">Select…</option>
              </select>
            </td>
            <td>
              <select class="m-area edit-select" disabled>
                <option value="">Select…</option>
              </select>
            </td>
            <td><input type="number" class="m-dur edit-number" min="0" /></td>
            <td>
              <div class="row-controls">
                <button type="button" class="row-add" title="Add row">＋</button>
                <button type="button" class="row-remove" title="Remove row">－</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div>
        <button type="button" id="multiAddBtn" class="btn primary">Add All</button>
        <button type="button" id="multiClearBtn" class="btn ghost">Clear</button>
      </div>
    </section>
  </div>

  <div id="dialogOverlay">
    <div id="dialogBox">
      <div id="dialogMessage"></div>
      <div id="dialogButtons">
        <button type="button" id="btnYes">Yes</button>
        <button type="button" id="btnNo">No</button>
        <button type="button" id="btnOk">OK</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/activities.js"></script>
</body>
</html>
