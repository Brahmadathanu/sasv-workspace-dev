<!DOCTYPE html>
<html lang="en" data-sasv-theme="sasv-core">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SASV WORKSPACE | Manage Activities</title>
  <link rel="stylesheet" href="public/shared/css/style.css">
  <link rel="stylesheet" href="public/shared/css/sasv-manage-activities.css">
</head>
<body class="sasv-module" data-theme="system">
  <div class="sasv-module-shell ma-shell">
    <header class="sasv-module-header header-bar">
      <div class="sasv-module-heading">
        <h1 class="sasv-module-title">Manage Activities</h1>
      </div>
      <button type="button" id="homeBtn" class="action-link" title="Home" aria-label="Home"></button>
    </header>

    <div id="maStatus" class="ma-banner" role="status" aria-live="polite" hidden></div>

    <main id="maMain" hidden>
      <section aria-labelledby="maListTitle">
        <div class="ma-section-head">
          <h2 id="maListTitle" class="sasv-module-section-title">Activities</h2>
          <span id="maCount" class="sasv-chip sasv-chip--neutral" aria-live="polite"></span>
          <button type="button" id="maNewBtn" class="btn primary" data-requires-edit>New activities</button>
        </div>

        <form class="sasv-toolbar ma-filters" id="maFilters" role="search" onsubmit="return false">
          <div class="sasv-field"><label for="nameFilter">Search name</label>
            <input type="search" id="nameFilter" placeholder="Activity name" autocomplete="off"></div>
          <div class="sasv-field"><label for="sectionFilter">Section</label>
            <select id="sectionFilter"><option value="">All sections</option></select></div>
          <div class="sasv-field"><label for="subFilter">Sub-section</label>
            <select id="subFilter" disabled><option value="">All sub-sections</option></select></div>
          <div class="sasv-field"><label for="areaFilter">Area</label>
            <select id="areaFilter" disabled><option value="">All areas</option></select></div>
          <div class="sasv-field"><label for="kindFilter">Kind</label>
            <select id="kindFilter"><option value="">All kinds</option></select></div>
          <div class="sasv-toolbar-actions">
            <button type="button" id="clearFilters" class="btn ghost">Clear</button>
          </div>
        </form>

        <div class="ma-table-wrap" tabindex="0" role="region" aria-label="Activities table">
          <table id="existingTable" aria-busy="false">
            <thead>
              <tr>
                <th scope="col">Activity</th><th scope="col">Section</th><th scope="col">Sub-section</th>
                <th scope="col">Area</th><th scope="col">Kind</th><th scope="col" class="ma-num">Days</th>
                <th scope="col" data-requires-edit><span class="ma-sr">Actions</span></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <p id="maEmpty" class="ma-empty" hidden></p>

        <nav class="sasv-pager" aria-label="Pagination">
          <span id="maPagerInfo" class="sasv-pager__info" aria-live="polite"></span>
          <div class="sasv-pager__controls">
            <label for="maPageSize" class="ma-sr">Rows per page</label>
            <select id="maPageSize" aria-label="Rows per page"></select>
            <button type="button" id="maPrev" class="btn ghost">Previous</button>
            <span id="maPageLabel" class="sasv-pager__info"></span>
            <button type="button" id="maNext" class="btn ghost">Next</button>
          </div>
        </nav>
      </section>

      <section id="maBulk" aria-labelledby="maBulkTitle" data-requires-edit hidden>
        <div class="ma-section-head">
          <h2 id="maBulkTitle" class="sasv-module-section-title">Add new activities</h2>
          <button type="button" id="maPasteBtn" class="btn ghost">Paste names…</button>
        </div>
        <div class="ma-table-wrap" tabindex="0" role="region" aria-label="New activities table">
          <table id="multiTable">
            <thead>
              <tr>
                <th scope="col">#</th><th scope="col">Activity</th><th scope="col">Section</th>
                <th scope="col">Sub-section</th><th scope="col">Area</th><th scope="col">Kind</th>
                <th scope="col" class="ma-num">Days</th><th scope="col"><span class="ma-sr">Row actions</span></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="ma-actions">
          <button type="button" id="maAddRow" class="btn ghost">Add row</button>
          <button type="button" id="multiClearBtn" class="btn ghost">Clear all</button>
          <button type="button" id="multiAddBtn" class="btn primary">Add all</button>
          <span id="maBulkSummary" class="sasv-pager__info" role="status" aria-live="polite"></span>
        </div>
      </section>
    </main>
  </div>

  <div id="maDialogHost"></div>
  <script type="module" src="js/activities.js"></script>
</body>
</html>
