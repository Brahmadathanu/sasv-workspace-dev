<!DOCTYPE html>
<html lang="en" data-sasv-theme="sasv-core">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SASV WORKSPACE | Manage Plant/Machinery Types</title>
  <link rel="stylesheet" href="public/shared/css/style.css">
</head>
<body class="sasv-module" data-theme="system">
  <div class="sasv-module-shell">
    <header class="sasv-module-header header-bar">
      <div class="sasv-module-heading">
        <h1 class="sasv-module-title">Manage Plant/Machinery Types</h1>
      </div>
      <button type="button" id="homeIcon" class="action-link" title="Home" aria-label="Home"></button>
    </header>

    <!-- Live search -->
    <div class="filters sasv-toolbar">
      <input type="text" id="searchInput" placeholder="Filter types…">
      <button type="button" id="clearSearch">Clear</button>
    </div>

    <!-- Existing Types -->
    <section>
      <h3 class="sasv-module-section-title">Existing Plant/Machinery Types</h3>
      <table id="typesTable">
        <thead>
          <tr><th>Type Name</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- Multi-Add -->
    <section>
      <h3 class="sasv-module-section-title">Add New Types</h3>
      <table id="multiTypeTable">
        <thead>
          <tr><th>Type Name</th><th> </th></tr>
        </thead>
        <tbody>
          <tr>
            <td><input type="text" class="m-name"></td>
            <td>
              <div class="row-controls">
                <button type="button" class="row-add" title="Add row">＋</button>
                <button type="button" class="row-remove" title="Remove row">－</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div>
        <button type="button" id="multiAddBtn" class="btn primary">Add All</button>
        <button type="button" id="multiClearBtn" class="btn ghost">Clear</button>
      </div>
    </section>
  </div>

  <!-- Confirm dialog -->
  <div id="dialogOverlay">
    <div id="dialogBox">
      <div id="dialogMessage"></div>
      <div id="dialogButtons">
        <button type="button" id="btnYes">Yes</button>
        <button type="button" id="btnNo">No</button>
        <button type="button" id="btnOk">OK</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/machine-types.js"></script>
</body>
</html>
